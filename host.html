<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Host - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; 
            height: 100dvh; 
            overflow: hidden; 
            display: flex; flex-direction: column; 
            background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        .dark #bg-container { display: none; }

        #bg-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1;
            overflow: hidden;
        }
        .cloud {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.6;
            animation: floatClouds 15s infinite alternate ease-in-out;
        }
        .cloud-pink { background: #ffdce0; width: 65vw; height: 65vw; top: -15%; left: -10%; }
        .cloud-blue { background: #dcf2ff; width: 75vw; height: 75vw; bottom: -20%; right: -5%; animation-delay: -4s; }
        .cloud-green { background: #dcffe4; width: 55vw; height: 55vw; top: 25%; left: 15%; animation-delay: -7s; }

        @keyframes floatClouds {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(8%, 8%) scale(1.05); }
        }

        .btn-game {
            border-radius: 24px;
            color: white;
            font-weight: 700;
            transition: all 0.2s ease;
            border-bottom: 6px solid rgba(0,0,0,0.15);
            text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
        }
        .btn-game:active { transform: translateY(4px); border-bottom-width: 2px; }
        
        .btn-start { background-color: #b9fbc0; color: #1a531b; }
        .btn-quit { background-color: #ff9aa2; }

        .bento-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
        }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }

        #player-list::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="bg-container">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
        <div class="cloud cloud-green"></div>
    </div>

    <main class="relative z-10 flex flex-col items-center h-full w-full p-6">
        
        <div class="w-full max-w-lg mt-4 mb-6">
            <div class="bento-card p-6 text-center">
                <p class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1">Code de la Room</p>
                <h2 id="display-code" class="text-6xl font-black text-gray-800 dark:text-white tracking-tighter">-----</h2>
            </div>
        </div>

        <div class="flex-1 w-full max-w-lg bento-card p-6 mb-6 overflow-hidden flex flex-col">
            <h3 class="text-sm font-black text-gray-700 dark:text-gray-200 mb-4 flex justify-between">
                <span>JOUEURS PRÊTS</span>
                <span id="player-count" class="bg-white/50 dark:bg-black/20 px-2 rounded-lg">0</span>
            </h3>
            <div id="player-list" class="flex-1 overflow-y-auto space-y-3">
                <p class="text-center text-gray-400 italic text-sm mt-10">En attente de joueurs...</p>
            </div>
        </div>

        <div class="w-full max-w-lg grid grid-cols-2 gap-4 pb-4">
            <button id="btn-quit" class="btn-game btn-quit p-4 text-sm font-black italic">QUITTER</button>
            <button id="start-game" class="btn-game btn-start p-4 text-sm font-black italic uppercase">Lancer !</button>
        </div>

    </main>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, onValue, update, onDisconnect, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Thème sombre
        if (localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const displayCode = document.getElementById('display-code');

        if (!roomId) {
            window.location.href = 'menu.html';
        } else {
            displayCode.innerText = roomId;
            const roomRef = ref(db, `rooms/${roomId}`);

            // 1. Annuler l'expiration dès que le Host est présent
            update(roomRef, { 
                expiresAt: null,
                lastActive: serverTimestamp() 
            });

            // 2. Sécurité de déconnexion : on marque le temps actuel + 1 min si le Host part
            onDisconnect(roomRef).update({
                expiresAt: Date.now() + 60000
            });

            // 3. Écoute des joueurs en temps réel
            const playersRef = ref(db, `rooms/${roomId}/players`);
            onValue(playersRef, (snapshot) => {
                const list = document.getElementById('player-list');
                const countText = document.getElementById('player-count');
                
                if (snapshot.exists()) {
                    const players = snapshot.val();
                    const entries = Object.entries(players);
                    countText.innerText = entries.length;

                    let html = "";
                    entries.forEach(([id, data]) => {
                        html += `
                            <div class="flex items-center justify-between p-3 bg-white/80 dark:bg-zinc-900/50 rounded-2xl border-b-4 border-black/5 animate-in fade-in slide-in-from-bottom-2 duration-300">
                                <div class="flex items-center gap-3 text-left">
                                    <div class="w-3 h-3 rounded-full" style="background:${data.color || '#ff9aa2'}"></div>
                                    <span class="font-bold dark:text-white">${data.pseudo || 'Anonyme'}</span>
                                </div>
                                <span class="text-[10px] font-black text-green-500 bg-green-100 dark:bg-green-900/30 px-2 py-1 rounded-lg">PRÊT</span>
                            </div>
                        `;
                    });
                    list.innerHTML = html;
                } else {
                    list.innerHTML = `<p class="text-center text-gray-400 italic text-sm mt-10">En attente de joueurs...</p>`;
                    countText.innerText = "0";
                }
            });
        }

        // Action Quitter
        document.getElementById('btn-quit').onclick = async () => {
            if(confirm("Voulez-vous vraiment fermer la room ?")) {
                await remove(ref(db, `rooms/${roomId}`)); // Suppression immédiate
                window.location.href = 'menu.html';
            }
        };

        // Action Lancer
        document.getElementById('start-game').onclick = () => {
            update(ref(db, `rooms/${roomId}`), { state: 'playing' });
            window.location.href = `game_host.html?room=${roomId}`;
        };
    </script>
</body>
</html>
