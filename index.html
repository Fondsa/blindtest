<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindtest Party 🎶 - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Fredoka', sans-serif;
            background-color: #FFDEE9;
            background-image: linear-gradient(0deg, #FFDEE9 0%, #B5FFFC 100%);
            background-attachment: fixed;
        }

        .bento-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 0px rgba(0,0,0,0.05);
        }

        .btn-game {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-game:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: none !important;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div class="max-w-2xl w-full space-y-8">
        
        <!-- LOGO / TITRE -->
        <div class="text-center space-y-4">
            <div class="floating text-7-xl inline-block bg-white p-6 rounded-[2.5rem] shadow-xl border-4 border-white mb-2">
                <span class="text-6xl">🎉</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-bold text-gray-800 tracking-tighter">
                Blindtest <span class="text-rose-500">Party</span>
            </h1>
            <p class="text-lg text-gray-600 font-medium">Prêt à défier tes amis en musique ?</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- BLOC CRÉER (HÔTE) -->
            <div class="bento-card p-8 flex flex-col items-center text-center space-y-6 border-b-8 border-b-purple-400">
                <div class="w-16 h-16 bg-purple-100 rounded-2xl flex items-center justify-center text-3xl">
                    👑
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-purple-700">Créer une Room</h2>
                    <p class="text-sm text-gray-500 mt-2">Deviens le DJ de la soirée et gère les scores.</p>
                </div>
                <button onclick="createRoom()" class="btn-game w-full py-4 bg-purple-500 text-white rounded-2xl font-bold text-lg shadow-[0_6px_0_0_#7e22ce] hover:bg-purple-400">
                    Lancer l'hôte
                </button>
            </div>

            <!-- BLOC REJOINDRE (JOUEUR) -->
            <div class="bento-card p-8 flex flex-col items-center text-center space-y-6 border-b-8 border-b-amber-400">
                <div class="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center text-3xl">
                    ⚡
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-amber-700">Rejoindre</h2>
                    <p class="text-sm text-gray-500 mt-2">Saisis le code pour buzzer plus vite que l'éclair !</p>
                </div>
                
                <div class="w-full space-y-3">
                    <input type="text" id="roomInput" placeholder="Code (ex: 1234)" 
                           class="w-full p-4 rounded-xl bg-gray-50 border-2 border-gray-100 text-center font-bold text-xl uppercase tracking-widest outline-none focus:border-amber-400 transition-all">
                    
                    <button onclick="joinRoom()" class="btn-game w-full py-4 bg-amber-400 text-amber-900 rounded-2xl font-bold text-lg shadow-[0_6px_0_0_#d97706] hover:bg-amber-300">
                        C'est parti !
                    </button>
                </div>
            </div>

        </div>

        <!-- FOOTER DISCRET -->
        <div class="text-center text-gray-500 text-sm font-medium opacity-60">
            Fait avec ❤️ pour des soirées de folie
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Fonction pour créer une room
        window.createRoom = async function() {
            const roomId = Math.floor(1000 + Math.random() * 9000).toString();
            const roomRef = ref(db, 'rooms/' + roomId);
            
            try {
                await set(roomRef, {
                    state: 'waiting',
                    createdAt: Date.now()
                });
                window.location.href = `admin.html?room=${roomId}`;
            } catch (error) {
                alert("Erreur lors de la création de la room.");
            }
        };

        // Fonction pour rejoindre une room
        window.joinRoom = async function() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) return alert("Hé ! Il me faut un code ! 😊");

            const roomRef = ref(db, 'rooms/' + roomId);
            const snapshot = await get(roomRef);

            if (snapshot.exists()) {
                window.location.href = `player.html?room=${roomId}`;
            } else {
                alert("Oups ! Cette room n'existe pas. Vérifie le code avec l'hôte ! 🧐");
            }
        };
    </script>
</body>
</html>
