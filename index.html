<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blindtest Party 🎶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(0deg, #FFDEE9 0%, #B5FFFC 100%);
            height: 100dvh; /* Adapté aux mobiles */
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bento-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 0px rgba(0,0,0,0.05);
        }
        .btn-game { transition: all 0.2s ease; }
        .btn-game:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4">

    <!-- LOGIN MODAL -->
    <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-white/20 backdrop-blur-md">
        <div class="bento-card p-8 w-full max-w-sm text-center space-y-6">
            <h2 class="text-2xl font-bold">On joue ? 🎵</h2>
            <div class="space-y-3">
                <button id="login-google" class="btn-game w-full py-4 bg-white border-2 border-gray-100 rounded-2xl font-bold flex items-center justify-center gap-2">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20"> Google
                </button>
                <button id="login-anon" class="btn-game w-full py-4 bg-gray-100 text-gray-600 rounded-2xl font-bold">👤 Mode Anonyme</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-content" class="hidden max-w-2xl w-full flex flex-col items-center gap-8">
        <div class="text-center">
            <h1 class="text-5xl font-bold text-gray-800 tracking-tighter italic">Blindtest <span class="text-rose-500 font-black">Party</span></h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
            <div class="bento-card p-6 flex flex-col items-center gap-4 border-b-8 border-purple-400">
                <span class="text-4xl">👑</span>
                <button id="btn-create" class="btn-game w-full py-5 bg-purple-500 text-white rounded-2xl font-bold text-lg shadow-[0_6px_0_0_#7e22ce]">CRÉER ROOM</button>
            </div>

            <div class="bento-card p-6 flex flex-col items-center gap-4 border-b-8 border-amber-400">
                <span class="text-4xl">⚡</span>
                <input type="text" id="roomInput" placeholder="CODE" class="w-full p-3 rounded-xl bg-gray-100 text-center font-bold text-xl uppercase outline-none focus:ring-4 ring-amber-200">
                <button id="btn-join" class="btn-game w-full py-5 bg-amber-400 text-amber-900 rounded-2xl font-bold text-lg shadow-[0_6px_0_0_#d97706]">REJOINDRE</button>
            </div>
        </div>
        
        <button id="btn-logout" class="text-xs font-bold text-gray-400 uppercase tracking-widest underline">Changer de compte</button>
    </div>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const modal = document.getElementById('auth-modal');
        const main = document.getElementById('main-content');

        // GESTION AUTH
        onAuthStateChanged(auth, (user) => {
            if (user) {
                modal.classList.add('hidden');
                main.classList.remove('hidden');
            } else {
                modal.classList.remove('hidden');
                main.classList.add('hidden');
            }
        });

        document.getElementById('login-anon').onclick = () => signInAnonymously(auth);
        document.getElementById('login-google').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById('btn-logout').onclick = () => signOut(auth);

        // GESTION ROOMS
        document.getElementById('btn-create').onclick = async () => {
            const id = Math.floor(1000 + Math.random() * 9000).toString();
            await set(ref(db, 'rooms/' + id), { state: 'waiting' });
            window.location.href = `admin.html?room=${id}`;
        };

        document.getElementById('btn-join').onclick = async () => {
            const id = document.getElementById('roomInput').value.trim();
            const snap = await get(ref(db, 'rooms/' + id));
            if (snap.exists()) window.location.href = `player.html?room=${id}`;
            else alert("Code introuvable ! 🕵️");
        };
    </script>
</body>
</html>
