<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Test Party</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fredoka One', cursive; }</style>
</head>
<body class="bg-indigo-600 text-white min-h-screen flex items-center justify-center p-4">

    <!-- SECTION 1 : CONNEXION -->
    <div id="auth-section" class="bg-white text-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
        <h1 class="text-4xl mb-6 text-indigo-600 font-black">PLAY !</h1>
        <div class="space-y-4">
            <button id="login-google" class="w-full py-4 bg-white border-2 border-gray-200 rounded-2xl flex items-center justify-center gap-2 hover:bg-gray-50 transition-all font-bold">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6"> Google
            </button>
            <button id="login-anon" class="w-full py-4 bg-slate-700 text-white rounded-2xl hover:bg-slate-800 transition-all font-bold">Mode Anonyme</button>
        </div>
    </div>

    <!-- SECTION 2 : PSEUDO -->
    <div id="pseudo-section" class="hidden bg-white text-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
        <h2 class="text-3xl mb-4 text-indigo-600">Ton Pseudo ?</h2>
        <input id="display-name" type="text" placeholder="Ex: MusiqueMaster" class="w-full p-4 mb-6 border-4 border-indigo-100 rounded-2xl outline-none focus:border-indigo-500 text-center text-xl uppercase">
        <button id="save-pseudo" class="w-full py-4 bg-pink-500 text-white rounded-2xl shadow-[0_6px_0_0_#9d174d] active:shadow-none active:translate-y-1 transition-all font-bold text-xl uppercase">Valider</button>
    </div>

    <!-- SECTION 3 : ROOMS -->
    <div id="role-section" class="hidden bg-white text-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
        <h2 class="text-3xl mb-6 text-indigo-600">Salut, <span id="user-greeting">...</span> !</h2>
        <div class="space-y-6">
            <button id="btn-create" class="w-full py-5 bg-yellow-400 text-indigo-900 rounded-2xl font-bold text-2xl shadow-[0_6px_0_0_#b45309] active:translate-y-1 active:shadow-none transition-all uppercase">Créer une Room</button>
            
            <div class="pt-6 border-t border-gray-100">
                <input id="room-input" type="text" placeholder="CODE ROOM" class="w-full p-4 mb-3 border-4 border-indigo-100 rounded-2xl text-center uppercase font-mono text-3xl outline-none focus:border-indigo-500">
                <button id="btn-join" class="w-full py-4 bg-indigo-500 text-white rounded-2xl font-bold text-xl shadow-[0_6px_0_0_#3730a3] active:translate-y-1 active:shadow-none transition-all uppercase">Rejoindre</button>
            </div>
        </div>
        <button id="logout" class="mt-8 text-gray-400 hover:text-red-500 text-sm underline">Déconnexion</button>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const auth = getAuth();
        const provider = new GoogleAuthProvider();
        const sections = { auth: document.getElementById('auth-section'), pseudo: document.getElementById('pseudo-section'), role: document.getElementById('role-section') };
        
        function showSection(id) {
            Object.values(sections).forEach(s => s.classList.add('hidden'));
            sections[id].classList.remove('hidden');
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snapshot = await get(ref(db, 'users/' + user.uid));
                if (snapshot.exists() && snapshot.val().displayName) {
                    document.getElementById('user-greeting').innerText = snapshot.val().displayName;
                    showSection('role');
                } else { showSection('pseudo'); }
            } else { showSection('auth'); }
        });

        document.getElementById('login-google').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('login-anon').onclick = () => signInAnonymously(auth);
        document.getElementById('logout').onclick = () => signOut(auth);

        document.getElementById('save-pseudo').onclick = async () => {
            const name = document.getElementById('display-name').value;
            if (name && auth.currentUser) {
                await set(ref(db, 'users/' + auth.currentUser.uid), { displayName: name });
                location.reload();
            }
        };

        const genID = () => Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('btn-create').onclick = () => window.location.href = `admin.html?room=${genID()}`;
        document.getElementById('btn-join').onclick = () => {
            const r = document.getElementById('room-input').value.trim().toUpperCase();
            if (r) window.location.href = `player.html?room=${r}`;
        };
    </script>
</body>
</html>
