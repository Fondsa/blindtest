<!-- Remplace la section Role par celle-ci -->
<div id="role-section" class="hidden bg-white text-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
    <h2 class="text-3xl mb-6 text-indigo-600">Salut, <span id="user-greeting">...</span> !</h2>
    
    <div class="space-y-4">
        <!-- Créer une partie -->
        <button id="btn-create" class="w-full py-4 bg-yellow-400 text-indigo-900 rounded-2xl font-bold text-xl shadow-[0_6px_0_0_#b45309] active:translate-y-1 active:shadow-none transition-all">HÉBERGER UNE PARTIE</button>
        
        <div class="py-4 border-t border-gray-100">
            <p class="text-gray-400 text-sm mb-2 uppercase font-bold">Ou rejoindre</p>
            <input id="room-input" type="text" placeholder="CODE DE LA ROOM" class="w-full p-4 mb-2 border-4 border-indigo-100 rounded-2xl text-center uppercase font-mono text-2xl outline-none focus:border-indigo-500">
            <button id="btn-join" class="w-full py-4 bg-indigo-500 text-white rounded-2xl font-bold text-xl shadow-[0_6px_0_0_#3730a3] active:translate-y-1 active:shadow-none transition-all">REJOINDRE</button>
        </div>
    </div>
    
    <button id="logout" class="mt-6 text-gray-400 hover:text-red-500 text-sm underline">Déconnexion</button>
</div>

<script type="module">
    // ... Garde ton code précédent et ajoute ceci pour les boutons :
    
    // Générer un ID aléatoire de 5 caractères
    const generateRoomId = () => Math.random().toString(36).substring(2, 7).toUpperCase();

    document.getElementById('btn-create').onclick = () => {
        const roomId = generateRoomId();
        window.location.href = `admin.html?room=${roomId}`;
    };

    document.getElementById('btn-join').onclick = () => {
        const roomId = document.getElementById('room-input').value.trim().toUpperCase();
        if (roomId.length > 2) {
            window.location.href = `player.html?room=${roomId}`;
        } else {
            alert("Entre un code valide !");
        }
    };
</script>
