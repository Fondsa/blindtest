<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blindtest Party 🎶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(0deg, #FFDEE9 0%, #B5FFFC 100%);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bento-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 32px;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 0px rgba(0,0,0,0.05);
        }

        .btn-game {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-game:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: none !important;
        }

        .floating { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Overlay flou */
        #auth-modal {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .google-btn {
            background: #ffffff;
            color: #757575;
            border: 1px solid #ddd;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
        }
    </style>
</head>
<body class="p-4">

    <!-- MODAL DE CONNEXION (Design "Pop") -->
    <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center p-6">
        <div class="bento-card p-8 w-full max-w-sm text-center space-y-8 shadow-2xl">
            <div class="text-6xl floating">🍭</div>
            <div>
                <h2 class="text-3xl font-bold text-gray-800 tracking-tight">Bienvenue !</h2>
                <p class="text-gray-500 font-medium">Connecte-toi pour lancer la fête</p>
            </div>
            
            <div class="space-y-3">
                <!-- Bouton Google Stylé -->
                <button id="login-google" class="btn-game w-full flex items-center justify-center gap-3 bg-white border border-gray-200 py-3 px-4 rounded-xl font-bold shadow-sm hover:bg-gray-50">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Continuer avec Google
                </button>

                <button id="login-email" class="btn-game w-full py-4 bg-indigo-500 text-white rounded-xl font-bold shadow-[0_4px_0_0_#4338ca]">
                    📧 Email / Mot de passe
                </button>

                <button id="login-anon" class="btn-game w-full py-4 bg-gray-100 text-gray-600 rounded-xl font-bold border-2 border-white">
                    👤 Mode Anonyme
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT (Flouté en arrière-plan) -->
    <div id="main-content" class="max-w-4xl w-full flex flex-col items-center gap-10">
        <div class="text-center">
            <h1 class="text-6xl font-black text-gray-800 tracking-tighter italic">Blindtest <span class="text-rose-500">Party</span></h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-2xl">
            <div class="bento-card p-8 flex flex-col items-center text-center space-y-6 border-b-[10px] border-b-purple-400">
                <div class="text-5xl">👑</div>
                <button id="btn-create" class="btn-game w-full py-5 bg-purple-500 text-white rounded-2xl font-bold text-xl shadow-[0_6px_0_0_#7e22ce]">CRÉER ROOM</button>
            </div>

            <div class="bento-card p-8 flex flex-col items-center text-center space-y-6 border-b-[10px] border-b-amber-400">
                <div class="text-5xl">⚡</div>
                <div class="w-full space-y-4">
                    <input type="text" id="roomInput" placeholder="CODE" class="w-full p-4 rounded-xl bg-gray-50 border-2 border-gray-100 text-center font-bold text-2xl uppercase outline-none focus:border-amber-400">
                    <button id="btn-join" class="btn-game w-full py-5 bg-amber-400 text-amber-900 rounded-2xl font-bold text-xl shadow-[0_6px_0_0_#d97706]">REJOINDRE</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { 
            signInAnonymously, 
            GoogleAuthProvider, 
            signInWithPopup, 
            onAuthStateChanged, 
            signOut,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const modal = document.getElementById('auth-modal');

        // Surveiller l'Auth
        onAuthStateChanged(auth, (user) => {
            if (user) {
                modal.classList.add('hidden'); // On cache le modal flou
            } else {
                modal.classList.remove('hidden'); // On affiche le modal flou
            }
        });

        // ACTIONS BOUTONS
        document.getElementById('login-google').onclick = () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).catch(err => alert("Erreur Google: " + err.message));
        };

        document.getElementById('login-anon').onclick = () => {
            signInAnonymously(auth).catch(err => alert("Erreur Anonyme: " + err.message));
        };

        document.getElementById('login-email').onclick = async () => {
            const email = prompt("Email :");
            const pass = prompt("Mot de passe :");
            if (email && pass) {
                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                } catch (e) {
                    try {
                        await createUserWithEmailAndPassword(auth, email, pass);
                    } catch (err) { alert("Erreur : " + err.message); }
                }
            }
        };

        document.getElementById('btn-create').onclick = async () => {
            const id = Math.floor(1000 + Math.random() * 9000).toString();
            await set(ref(db, 'rooms/' + id), { state: 'waiting' });
            window.location.href = `admin.html?room=${id}`;
        };

        document.getElementById('btn-join').onclick = async () => {
            const id = document.getElementById('roomInput').value.trim();
            if(!id) return;
            const snap = await get(ref(db, 'rooms/' + id));
            if (snap.exists()) window.location.href = `player.html?room=${id}`;
            else alert("Room introuvable !");
        };
    </script>
</body>
</html>
