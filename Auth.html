<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #FFDEE9; height: 100dvh; display: flex; align-items: center; justify-content: center; }
        .bento-card { background: white; border-radius: 32px; border: 4px solid #fff; box-shadow: 0 10px 0px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-6">
    <!-- Test -->
    <div class="bento-card p-8 w-full max-w-sm space-y-6">
        <div class="text-center"><h1 id="auth-title" class="text-3xl font-bold">Bienvenue !</h1></div>
        
        <div id="register-fields" class="space-y-4">
            <input type="text" id="reg-pseudo" placeholder="Ton Pseudo" class="w-full p-4 rounded-2xl bg-gray-50 border-2 border-gray-100 outline-none focus:border-rose-400">
        </div>
        
        <div class="space-y-4">
            <input type="email" id="auth-email" placeholder="Email" class="w-full p-4 rounded-2xl bg-gray-50 border-2 border-gray-100 outline-none">
            <input type="password" id="auth-pass" placeholder="Mot de passe" class="w-full p-4 rounded-2xl bg-gray-50 border-2 border-gray-100 outline-none">
        </div>

        <button id="btn-primary" class="w-full py-4 bg-rose-500 text-white rounded-2xl font-bold shadow-[0_5px_0_0_#be123c]">S'inscrire</button>
        
        <button id="btn-google" class="w-full py-3 border-2 border-gray-100 rounded-2xl flex items-center justify-center gap-2 font-bold bg-white">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5"> Google
        </button>

        <p class="text-center text-sm text-gray-500 cursor-pointer underline" id="toggle-auth">Déjà un compte ? Se connecter</p>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        let isRegister = true;
        const btnPrimary = document.getElementById('btn-primary');
        const toggleAuth = document.getElementById('toggle-auth');
        const regFields = document.getElementById('register-fields');

        toggleAuth.onclick = () => {
            isRegister = !isRegister;
            document.getElementById('auth-title').innerText = isRegister ? "Bienvenue !" : "Content de te revoir";
            btnPrimary.innerText = isRegister ? "S'inscrire" : "Se connecter";
            regFields.classList.toggle('hidden', !isRegister);
        };

        btnPrimary.onclick = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            if(isRegister) {
                const pseudo = document.getElementById('reg-pseudo').value;
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(userCred.user, { displayName: pseudo });
            } else {
                await signInWithEmailAndPassword(auth, email, pass);
            }
            window.location.href = 'menu.html';
        };

        document.getElementById('btn-google').onclick = async () => {
            const provider = new GoogleAuthProvider();
            await signInWithPopup(auth, provider);
            window.location.href = 'menu.html';
        };
    </script>
</body>
</html>
