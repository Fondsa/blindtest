<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upload Admin - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; height: 100dvh; overflow: hidden; 
            display: flex; flex-direction: column; background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1; overflow: hidden; }
        .cloud { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6; animation: floatClouds 15s infinite alternate ease-in-out; }
        .cloud-pink { background: #ffdce0; width: 60vw; height: 60vw; top: -10%; left: -5%; }
        .cloud-blue { background: #dcf2ff; width: 70vw; height: 70vw; bottom: -15%; right: -5%; }
        @keyframes floatClouds { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }

        .btn-game {
            border-radius: 20px;
            color: white;
            font-weight: 700;
            border-bottom: 5px solid rgba(0,0,0,0.15);
            transition: all 0.1s ease;
            text-transform: uppercase;
        }
        .btn-game:active { transform: translateY(3px); border-bottom-width: 2px; }
        .btn-primary { background-color: #6366f1; }
        .btn-disabled { background-color: #d1d5db; border-bottom: none; transform: none; cursor: not-allowed; }

        .bento-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
        }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }

        input::file-selector-button {
            background: #6366f1;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="bg-container">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
    </div>

    <main class="relative z-10 flex flex-col h-full w-full p-6 items-center justify-center">
        
        <div class="w-full max-w-md space-y-6">
            <div class="flex items-center gap-4 mb-2">
                <button onclick="history.back()" class="bento-card w-12 h-12 flex items-center justify-center text-lg">⬅️</button>
                <div>
                    <h1 class="text-2xl font-black text-gray-800 dark:text-white italic uppercase tracking-tighter">Admin <span class="text-indigo-500">Upload</span></h1>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Ajout à la liste commune</p>
                </div>
            </div>

            <div class="bento-card p-6 space-y-4">
                <!-- Titre -->
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-1 ml-1">Titre de la musique</label>
                    <input type="text" id="track-title" placeholder="Ex: Master of Puppets" 
                        class="w-full p-3 rounded-xl bg-white/50 dark:bg-black/20 dark:text-white border-none focus:ring-2 focus:ring-indigo-300 outline-none">
                </div>

                <!-- Artiste -->
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-1 ml-1">Artiste</label>
                    <input type="text" id="track-artist" placeholder="Ex: Metallica" 
                        class="w-full p-3 rounded-xl bg-white/50 dark:bg-black/20 dark:text-white border-none focus:ring-2 focus:ring-indigo-300 outline-none">
                </div>

                <!-- Fichier -->
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-1 ml-1">Fichier MP3 (Max 30s / 2.5Mo)</label>
                    <input type="file" id="track-file" accept="audio/*" 
                        class="w-full text-sm text-gray-500 dark:text-gray-300">
                </div>

                <!-- Status -->
                <div id="upload-status" class="hidden text-center text-[10px] font-black py-3 rounded-xl transition-all uppercase tracking-widest"></div>

                <!-- Bouton -->
                <button id="btn-upload" class="btn-game btn-primary w-full py-4 mt-2 italic">Enregistrer dans la base globale</button>
            </div>
        </div>

    </main>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, push, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const btnUpload = document.getElementById('btn-upload');
        const status = document.getElementById('upload-status');

        // Sécurité Admin
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            const snap = await get(ref(db, `users/${user.uid}`));
            if (!snap.exists() || !snap.val().isAdmin) {
                window.location.href = 'menu.html';
            }
        });

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        btnUpload.onclick = async () => {
            const file = document.getElementById('track-file').files[0];
            const title = document.getElementById('track-title').value.trim();
            const artist = document.getElementById('track-artist').value.trim();

            if (!file || !title) {
                showStatus("Titre et fichier requis !", "bg-red-100 text-red-600 border border-red-200");
                return;
            }

            // Vérification taille (Base64 augmente la taille de 33%, donc 2.5Mo max fichier source)
            if (file.size > 2.5 * 1024 * 1024) {
                showStatus("Fichier trop lourd (Max 2.5 Mo)", "bg-red-100 text-red-600 border border-red-200");
                return;
            }

            try {
                btnUpload.disabled = true;
                btnUpload.classList.add('btn-disabled');
                btnUpload.innerText = "Traitement...";
                showStatus("Conversion en cours...", "bg-indigo-100 text-indigo-600 animate-pulse");

                const base64Data = await toBase64(file);

                showStatus("Upload vers la base globale...", "bg-amber-100 text-amber-700");

                // Envoi vers musics/base (la liste commune)
                await push(ref(db, 'musics/base'), {
                    title: title,
                    artist: artist || "Artiste Inconnu",
                    url: base64Data,
                    createdAt: Date.now(),
                    isAdminFile: true
                });

                showStatus("✅ Musique ajoutée avec succès !", "bg-green-100 text-green-700 border border-green-200");
                
                // Reset
                document.getElementById('track-title').value = "";
                document.getElementById('track-artist').value = "";
                document.getElementById('track-file').value = "";

            } catch (error) {
                console.error(error);
                showStatus("Erreur : " + error.message, "bg-red-100 text-red-600");
            } finally {
                btnUpload.disabled = false;
                btnUpload.classList.remove('btn-disabled');
                btnUpload.innerText = "Enregistrer dans la base globale";
            }
        };

        function showStatus(msg, classes) {
            status.innerText = msg;
            status.className = `text-center text-[10px] font-black py-3 rounded-xl ${classes} uppercase tracking-widest`;
            status.classList.remove('hidden');
        }

        if(localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');
    </script>
</body>
</html>
