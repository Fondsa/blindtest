<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joueur - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; height: 100dvh; overflow: hidden; 
            display: flex; flex-direction: column; background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1; overflow: hidden; }
        .cloud { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6; animation: floatClouds 15s infinite alternate ease-in-out; }
        .cloud-pink { background: #ffdce0; width: 60vw; height: 60vw; top: -10%; left: -5%; }
        .cloud-blue { background: #dcf2ff; width: 70vw; height: 70vw; bottom: -15%; right: -5%; }
        @keyframes floatClouds { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }

        .buzzer-btn {
            width: 220px; height: 220px;
            border-radius: 50%; background: #ff9aa2; border: none;
            box-shadow: 0 15px 0 #ffb7bc, 0 20px 30px rgba(255, 154, 162, 0.4);
            cursor: pointer; transition: all 0.1s ease;
            display: flex; align-items: center; justify-content: center;
            outline: none; -webkit-tap-highlight-color: transparent;
        }
        .buzzer-btn:active:not(:disabled) {
            transform: translateY(10px);
            box-shadow: 0 5px 0 #ffb7bc, 0 10px 15px rgba(255, 154, 162, 0.2);
        }
        .buzzer-btn:disabled {
            background: #d1d5db; box-shadow: 0 10px 0 #9ca3af;
            opacity: 0.6; cursor: not-allowed; transform: translateY(5px);
            filter: grayscale(1);
        }
        .bento-card { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 24px; }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
        
        .answer-reveal {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="bg-container">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
    </div>

    <main class="relative z-10 flex flex-col items-center justify-between h-full w-full p-6">
        
        <div class="w-full flex justify-between items-center">
            <div class="bento-card px-4 py-2 flex items-center gap-2">
                <div id="player-color" class="w-3 h-3 rounded-full bg-gray-400"></div>
                <span id="player-name" class="text-xs font-bold dark:text-white uppercase italic">Chargement...</span>
            </div>
            <div class="bento-card px-4 py-2">
                <span id="player-score" class="text-xs font-black text-rose-400 italic">0 PTS</span>
            </div>
        </div>

        <div class="flex flex-col items-center space-y-6 w-full">
            
            <div id="reveal-zone" class="hidden w-full max-w-xs bento-card p-6 text-center border-4 border-rose-300 answer-reveal">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">La réponse était</p>
                <p id="revealed-answer" class="text-lg font-black text-rose-500 uppercase italic leading-tight"></p>
            </div>

            <div id="status-text" class="text-xl font-black text-gray-800 dark:text-white uppercase italic tracking-tighter text-center transition-all duration-300">
                En attente...
            </div>
            
            <button id="buzzer" class="buzzer-btn" disabled>
                <span class="text-white font-black text-3xl italic tracking-tighter uppercase">Buzz !</span>
            </button>
        </div>

        <div class="w-full max-w-xs mb-4 text-center">
            <div class="bento-card p-3">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Connecté à la room</p>
                <p id="display-room" class="text-lg font-black text-gray-800 dark:text-white">----</p>
            </div>
            <button id="btn-quit" class="mt-4 text-xs font-bold text-gray-400 underline">Quitter la partie</button>
        </div>

    </main>

    <audio id="local-audio"></audio>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, onValue, onDisconnect, remove, update, serverTimestamp, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        if (localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const buzzerBtn = document.getElementById('buzzer');
        const statusText = document.getElementById('status-text');
        const revealZone = document.getElementById('reveal-zone');
        const revealedAnswer = document.getElementById('revealed-answer');
        
        onAuthStateChanged(auth, (user) => {
            if (!user || !roomId) { window.location.href = 'menu.html'; return; }

            const playerId = user.uid;
            const playerRef = ref(db, `rooms/${roomId}/players/${playerId}`);
            const roomRef = ref(db, `rooms/${roomId}`);

            document.getElementById('display-room').innerText = roomId;
            onDisconnect(playerRef).remove();

            // 1. Synchro Infos Joueur
            onValue(playerRef, (snapshot) => {
                if (snapshot.exists()) {
                    const d = snapshot.val();
                    document.getElementById('player-name').innerText = d.pseudo || "Anonyme";
                    document.getElementById('player-score').innerText = `${d.score || 0} PTS`;
                    document.getElementById('player-color').style.backgroundColor = d.color || "#ff9aa2";
                }
            });

            // 2. Synchro État de la Room (Logique de Jeu)
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const myBuzz = data.buzzHistory && data.buzzHistory[playerId];

                // GESTION RÉVÉLATION (L'host a cliqué sur Révéler)
                if (data.revealed) {
                    revealZone.classList.remove('hidden');
                    revealedAnswer.innerText = data.currentTrack || "???";
                    statusText.innerText = "FIN DE MANCHE";
                    statusText.className = "text-xl font-black text-rose-500 uppercase italic text-center";
                    buzzerBtn.disabled = true;
                    return;
                } else {
                    revealZone.classList.add('hidden');
                }

                // GESTION DU BUZZER SELON L'ÉTAT
                if (data.state === 'playing') {
                    if (myBuzz) {
                        // J'ai déjà buzzé
                        buzzerBtn.disabled = true;
                        statusText.innerText = "BUZZ ENREGISTRÉ !";
                        statusText.className = "text-xl font-black text-green-500 uppercase italic text-center";
                    } else {
                        // Musique en cours, je peux buzzer (même si d'autres l'ont fait)
                        buzzerBtn.disabled = false;
                        statusText.innerText = "C'EST LE MOMENT !";
                        statusText.className = "text-xl font-black text-gray-800 dark:text-white uppercase italic text-center animate-pulse";
                    }
                } else if (data.state === 'ready') {
                    buzzerBtn.disabled = true;
                    statusText.innerText = "TENEZ-VOUS PRÊT...";
                    statusText.className = "text-xl font-black text-gray-400 uppercase italic text-center";
                } else {
                    buzzerBtn.disabled = true;
                    statusText.innerText = "EN ATTENTE...";
                    statusText.className = "text-xl font-black text-gray-400 uppercase italic text-center";
                }
            });

            // 3. LOGIQUE DU CLIC SUR BUZZER
            buzzerBtn.onclick = () => {
                // On enregistre dans buzzHistory sans bloquer les autres
                const myBuzzRef = ref(db, `rooms/${roomId}/buzzHistory/${playerId}`);
                set(myBuzzRef, serverTimestamp());
                
                if (navigator.vibrate) navigator.vibrate(100); // Petit retour tactile
            };

            document.getElementById('btn-quit').onclick = async () => {
                if (confirm("Quitter la partie ?")) {
                    await remove(playerRef);
                    window.location.href = 'menu.html';
                }
            };
        });
    </script>
</body>
</html>
