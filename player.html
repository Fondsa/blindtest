<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fredoka One', cursive; }</style>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center justify-center min-h-screen p-4">
    <input id="pseudo" type="text" placeholder="Ton Pseudo" class="mb-8 p-3 rounded-lg text-black text-center outline-none focus:ring-4 ring-pink-500">
    
    <button id="buzzer" class="w-72 h-72 rounded-full bg-red-600 shadow-[0_12px_0_0_#991b1b] active:shadow-none active:translate-y-2 flex items-center justify-center text-4xl border-8 border-red-500 transition-all">
        BUZZ !
    </button>
    <p id="msg" class="mt-8 text-xl text-yellow-400"></p>

    <script type="module">
        import { db, sanitize } from './firebase-config.js';
        import { ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const btn = document.getElementById('buzzer');
        const msg = document.getElementById('msg');
        const pseudoInput = document.getElementById('pseudo');

        onValue(ref(db, 'game'), (snap) => {
            const data = snap.val();
            if (data?.state === 'buzzed') {
                btn.classList.add('opacity-30', 'grayscale');
                btn.disabled = true;
                msg.innerText = `${data.winner} a été le plus rapide !`;
            } else {
                btn.classList.remove('opacity-30', 'grayscale');
                btn.disabled = false;
                msg.innerText = "Écoute bien...";
            }
        });

        btn.onclick = () => {
            const name = sanitize(pseudoInput.value) || "Anonyme";
            update(ref(db, 'game'), { state: 'buzzed', winner: name });
        };
    </script>
</body>
</html>
