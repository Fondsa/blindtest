<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joueur - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; height: 100dvh; overflow: hidden; 
            display: flex; flex-direction: column; background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        .dark #bg-container { display: none; }

        /* ☁️ NUAGES PASTEL */
        #bg-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1;
            overflow: hidden;
        }
        .cloud {
            position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6;
            animation: floatClouds 15s infinite alternate ease-in-out;
        }
        .cloud-pink { background: #ffdce0; width: 60vw; height: 60vw; top: -10%; left: -5%; }
        .cloud-blue { background: #dcf2ff; width: 70vw; height: 70vw; bottom: -15%; right: -5%; }
        
        @keyframes floatClouds { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }

        /* 🚨 LE BUZZER */
        .buzzer-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: #ff9aa2;
            border: none;
            box-shadow: 0 15px 0 #ffb7bc, 0 20px 30px rgba(255, 154, 162, 0.4);
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .buzzer-btn:active:not(:disabled) {
            transform: translateY(10px);
            box-shadow: 0 5px 0 #ffb7bc, 0 10px 15px rgba(255, 154, 162, 0.2);
        }
        .buzzer-btn:disabled {
            background: #d1d5db;
            box-shadow: 0 10px 0 #9ca3af;
            opacity: 0.6;
            cursor: not-allowed;
            transform: translateY(5px);
        }

        .bento-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
        }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <div id="bg-container">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
    </div>

    <main class="relative z-10 flex flex-col items-center justify-between h-full w-full p-6">
        
        <!-- INFO BAR -->
        <div class="w-full flex justify-between items-center">
            <div class="bento-card px-4 py-2 flex items-center gap-2">
                <div id="player-color" class="w-3 h-3 rounded-full bg-gray-400"></div>
                <span id="player-name" class="text-xs font-bold dark:text-white uppercase italic">Chargement...</span>
            </div>
            <div class="bento-card px-4 py-2">
                <span id="player-score" class="text-xs font-black text-rose-400 italic">0 PTS</span>
            </div>
        </div>

        <!-- ZONE CENTRALE : LE BUZZER -->
        <div class="flex flex-col items-center space-y-8">
            <div id="status-text" class="text-xl font-black text-gray-800 dark:text-white uppercase italic tracking-tighter text-center transition-colors duration-300">
                En attente de l'hôte...
            </div>
            
            <button id="buzzer" class="buzzer-btn" disabled>
                <span class="text-white font-black text-3xl italic tracking-tighter uppercase">Buzz !</span>
            </button>
        </div>

        <!-- FOOTER : INFOS ROOM -->
        <div class="w-full max-w-xs mb-4 text-center">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Connecté à la room</p>
            <p id="display-room" class="text-lg font-black text-gray-800 dark:text-white">----</p>
            <button onclick="location.href='menu.html'" class="mt-4 text-xs font-bold text-gray-400 underline">Quitter la partie</button>
        </div>

    </main>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // THÈME SOMBRE
        if (localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const playerId = localStorage.getItem('playerId');

        const buzzerBtn = document.getElementById('buzzer');
        const statusText = document.getElementById('status-text');
        const audioPlayer = new Audio();
        
        let canBuzz = false;

        if (!roomId || !playerId) {
            window.location.href = 'menu.html';
        }
        document.getElementById('display-room').innerText = roomId;

        // 1. SYNC AUDIO ET ÉTAT DU JEU
        onValue(ref(db, `rooms/${roomId}`), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Gestion de la musique
            if (data.state === 'playing' && data.currentAudio) {
                // On détecte si un nouveau morceau est lancé (via le timestamp startTime)
                if (audioPlayer.dataset.lastStart !== String(data.startTime)) {
                    audioPlayer.src = data.currentAudio;
                    audioPlayer.dataset.lastStart = data.startTime;
                    audioPlayer.play().catch(e => console.log("L'audio attend un clic utilisateur."));
                    
                    // Activer le buzz seulement quand la musique commence
                    canBuzz = true;
                    buzzerBtn.disabled = false;
                    statusText.innerText = "ÉCOUTE BIEN...";
                    statusText.className = "text-xl font-black text-gray-800 dark:text-white uppercase italic tracking-tighter text-center";
                }
            }

            // Gestion du Buzz
            if (data.buzzedBy) {
                audioPlayer.pause();
                canBuzz = false;
                buzzerBtn.disabled = true;

                if (data.buzzedBy === playerId) {
                    statusText.innerText = "C'EST À TOI !";
                    statusText.className = "text-xl font-black text-green-500 uppercase italic tracking-tighter text-center";
                } else {
                    statusText.innerText = "TROP TARD !";
                    statusText.className = "text-xl font-black text-rose-500 uppercase italic tracking-tighter text-center opacity-50";
                }
            } else if (data.state === 'playing' && !data.buzzedBy) {
                // Si l'admin reset le buzz sans changer de musique
                canBuzz = true;
                buzzerBtn.disabled = false;
                statusText.innerText = "RE-BUZZ POSSIBLE !";
                statusText.className = "text-xl font-black text-gray-800 dark:text-white uppercase italic tracking-tighter text-center";
            }
        });

        // 2. INFOS JOUEUR (Score, Couleur)
        onValue(ref(db, `rooms/${roomId}/players/${playerId}`), (snapshot) => {
            if (snapshot.exists()) {
                const d = snapshot.val();
                document.getElementById('player-name').innerText = d.pseudo;
                document.getElementById('player-score').innerText = `${d.score || 0} PTS`;
                document.getElementById('player-color').style.backgroundColor = d.color;
            }
        });

        // 3. ACTION DU BUZZER
        buzzerBtn.onclick = () => {
            if (!canBuzz) return;

            const buzzedRef = ref(db, `rooms/${roomId}/buzzedBy`);
            runTransaction(buzzedRef, (currentData) => {
                if (currentData === null) {
                    return playerId; // On prend la main
                }
                return; // Quelqu'un a déjà buzzé
            });
        };
    </script>
</body>
</html>
