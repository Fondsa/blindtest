<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buzzer - Blind Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fredoka One', cursive; touch-action: manipulation; }</style>
</head>
<body class="bg-indigo-900 text-white min-h-screen flex flex-col items-center justify-center p-6">
    
    <div class="w-full max-w-xs flex justify-between items-center mb-10 opacity-50">
        <a href="index.html" class="text-[10px] font-black uppercase italic tracking-widest">← Quitter</a>
        <span class="bg-indigo-800 px-4 py-1 rounded-full text-[10px] font-mono font-bold tracking-widest">ROOM: <span id="room-id" class="text-yellow-400">...</span></span>
    </div>

    <div class="text-center mb-10">
        <h2 id="player-name" class="text-2xl text-pink-500 uppercase font-black tracking-widest italic">...</h2>
    </div>

    <div class="relative">
        <div class="absolute inset-0 bg-red-900 rounded-full translate-y-4 shadow-2xl"></div>
        <button id="buzzer" disabled class="relative w-64 h-64 rounded-full bg-red-600 border-8 border-red-500 shadow-inner flex items-center justify-center text-5xl font-black transition-all active:translate-y-2 active:shadow-none disabled:bg-slate-800 disabled:border-slate-700 disabled:opacity-50">
            BUZZ
        </button>
    </div>

    <p id="msg" class="mt-12 text-md text-center text-indigo-400 font-bold uppercase tracking-tighter h-12"></p>

    <script type="module">
        import { db } from './firebase-config.js';
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { ref, onValue, update, get, onDisconnect, increment, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const roomRef = ref(db, 'rooms/' + roomId);
        const countRef = ref(db, 'rooms/' + roomId + '/playerCount');
        let myName = "";

        if(!roomId) window.location.href = "index.html";
        document.getElementById('room-id').innerText = roomId;

        onAuthStateChanged(getAuth(), async (user) => {
            if(!user) window.location.href = "index.html";
            const snap = await get(ref(db, 'users/' + user.uid));
            myName = snap.val()?.displayName || "Anonyme";
            document.getElementById('player-name').innerText = myName;

            update(roomRef, { playerCount: increment(1) });
            onDisconnect(countRef).set(increment(-1));
        });

        onValue(roomRef, (snap) => {
            if(!snap.exists()) { alert("Fin de partie !"); window.location.href="index.html"; return; }
            const data = snap.val();
            const btn = document.getElementById('buzzer');
            const msg = document.getElementById('msg');

            // Ai-je déjà buzzé ?
            const hasIBuzzed = data.buzzList && Object.values(data.buzzList).some(p => p.name === myName);

            if (data.state === 'playing' || data.state === 'buzzed') {
                if (hasIBuzzed) {
                    btn.disabled = true;
                    msg.innerText = "BUZZ ENREGISTRÉ !";
                    msg.classList.add('text-yellow-400');
                } else {
                    btn.disabled = false;
                    msg.innerText = "À TOI DE JOUER !";
                    msg.classList.remove('text-yellow-400');
                }
            } else {
                btn.disabled = true;
                msg.innerText = "Attends le lancement...";
                msg.classList.remove('text-yellow-400');
            }
        });

        document.getElementById('buzzer').onclick = () => {
            const listRef = ref(db, `rooms/${roomId}/buzzList`);
            push(listRef, { name: myName, time: serverTimestamp() });
        };
    </script>
</body>
</html>
