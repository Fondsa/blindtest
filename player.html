<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fredoka One', cursive; touch-action: manipulation; }</style>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center justify-center min-h-screen p-6 overflow-hidden">
    <input id="pseudo" type="text" placeholder="Ton Pseudo..." class="mb-10 p-4 rounded-2xl text-black text-center text-xl outline-none border-4 border-pink-500 w-full max-w-xs">
    
    <div class="relative">
        <!-- Le socle du buzzer -->
        <div class="absolute inset-0 bg-red-900 rounded-full translate-y-4"></div>
        <!-- Le bouton -->
        <button id="buzzer" class="relative w-64 h-64 rounded-full bg-red-600 border-8 border-red-400 shadow-inner flex items-center justify-center text-5xl font-black active:translate-y-2 active:shadow-none transition-all">
            BUZZ
        </button>
    </div>

    <p id="msg" class="mt-10 text-2xl text-yellow-400 text-center h-8"></p>

    <script type="module">
        import { db, sanitize } from './firebase-config.js';
        import { ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const btn = document.getElementById('buzzer');
        const msg = document.getElementById('msg');
        const pseudoInput = document.getElementById('pseudo');

        // Écouter l'état du jeu
        onValue(ref(db, 'game'), (snap) => {
            const data = snap.val();
            if (data?.state === 'buzzed') {
                btn.classList.add('opacity-40', 'grayscale');
                btn.disabled = true;
                msg.innerText = `🚨 ${data.winner.toUpperCase()} A BUZZÉ !`;
            } else {
                btn.classList.remove('opacity-40', 'grayscale');
                btn.disabled = false;
                msg.innerText = (data?.state === 'playing') ? "ÉCOUTE BIEN..." : "EN ATTENTE...";
            }
        });

        btn.onclick = () => {
            const name = sanitize(pseudoInput.value) || "Anonyme";
            update(ref(db, 'game'), { 
                state: 'buzzed', 
                winner: name 
            });
        };
    </script>
</body>
</html>
