<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joueur - Blind Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fredoka One', cursive; touch-action: manipulation; }</style>
</head>
<body class="bg-indigo-900 text-white min-h-screen flex flex-col items-center justify-center p-6 overflow-hidden">
    
    <div class="text-center mb-12">
        <p class="text-indigo-300 uppercase tracking-widest text-sm">Connecté en tant que</p>
        <h2 id="my-name" class="text-3xl text-pink-400">...</h2>
    </div>

    <div class="relative group">
        <!-- Effet d'ombre du buzzer -->
        <div class="absolute inset-0 bg-red-800 rounded-full translate-y-4"></div>
        <!-- Bouton Buzzer -->
        <button id="buzzer" class="relative w-64 h-64 rounded-full bg-red-600 border-8 border-red-500 shadow-inner flex items-center justify-center text-4xl font-black uppercase transition-all active:translate-y-2 active:shadow-none disabled:bg-gray-700 disabled:border-gray-600 disabled:opacity-50">
            BUZZ !
        </button>
    </div>

    <p id="status-msg" class="mt-12 text-xl text-indigo-200 h-8 font-light italic">En attente de l'hôte...</p>

    <script type="module">
        import { db } from './firebase-config.js';
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const auth = getAuth();
        const btn = document.getElementById('buzzer');
        const msg = document.getElementById('status-msg');
        let currentUserName = "Anonyme";

        // Vérification de l'auth et récupération du pseudo
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                const snap = await get(ref(db, 'users/' + user.uid));
                currentUserName = snap.val()?.displayName || "Joueur";
                document.getElementById('my-name').innerText = currentUserName;
            }
        });

        // Écouter l'état du jeu
        onValue(ref(db, 'game'), (snap) => {
            const data = snap.val();
            if (data?.state === 'buzzed') {
                btn.disabled = true;
                msg.innerText = `🚨 ${data.winner} a buzzé !`;
                msg.classList.add('text-yellow-400');
            } else if (data?.state === 'playing') {
                btn.disabled = false;
                msg.innerText = "Écoute bien la musique...";
                msg.classList.remove('text-yellow-400');
            } else {
                btn.disabled = true;
                msg.innerText = "Préparez-vous...";
            }
        });

        // Action du Buzz
        btn.onclick = () => {
            update(ref(db, 'game'), { 
                state: 'buzzed', 
                winner: currentUserName 
            });
        };
    </script>
</body>
</html>
