<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buzzer - Blind Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fredoka One', cursive; touch-action: manipulation; }</style>
</head>
<body class="bg-indigo-900 text-white min-h-screen flex flex-col items-center justify-center p-6">
    
    <div class="w-full max-w-xs flex justify-between items-center mb-10 opacity-70">
        <a href="index.html" class="text-sm font-bold">← Quitter</a>
        <span class="bg-indigo-800 px-4 py-1 rounded-full text-xs font-mono">ROOM: <span id="room-id-txt">...</span></span>
    </div>

    <div class="text-center mb-10">
        <p class="text-xs uppercase opacity-50 mb-1">Joueur</p>
        <h2 id="player-name" class="text-3xl text-pink-400 uppercase tracking-wide">...</h2>
    </div>

    <div class="relative">
        <div class="absolute inset-0 bg-red-800 rounded-full translate-y-4"></div>
        <button id="buzzer" disabled class="relative w-72 h-72 rounded-full bg-red-600 border-8 border-red-500 shadow-inner flex items-center justify-center text-5xl font-black transition-all active:translate-y-2 active:shadow-none disabled:bg-gray-700 disabled:border-gray-600 disabled:opacity-50">
            BUZZ
        </button>
    </div>

    <p id="msg" class="mt-12 text-xl text-center text-indigo-300 italic h-10"></p>

    <script type="module">
        import { db } from './firebase-config.js';
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const roomRef = ref(db, 'rooms/' + roomId);
        let myName = "";

        if(!roomId) window.location.href = "index.html";
        document.getElementById('room-id-txt').innerText = roomId;

        onAuthStateChanged(getAuth(), async (user) => {
            if(!user) window.location.href = "index.html";
            const snap = await get(ref(db, 'users/' + user.uid));
            myName = snap.val()?.displayName || "Anonyme";
            document.getElementById('player-name').innerText = myName;
        });

        onValue(roomRef, (snap) => {
            if(!snap.exists()) { alert("La room est fermée !"); window.location.href="index.html"; return; }
            const data = snap.val();
            const btn = document.getElementById('buzzer');
            const msg = document.getElementById('msg');

            if (data.state === 'buzzed') {
                btn.disabled = true;
                msg.innerText = `${data.winner} a buzzé !`;
                msg.classList.add('text-yellow-400');
            } else if (data.state === 'playing') {
                btn.disabled = false;
                msg.innerText = "Écoute bien...";
                msg.classList.remove('text-yellow-400');
            } else {
                btn.disabled = true;
                msg.innerText = "En attente de l'hôte...";
            }
        });

        document.getElementById('buzzer').onclick = () => {
            update(roomRef, { state: 'buzzed', winner: myName });
        };
    </script>
</body>
</html>
