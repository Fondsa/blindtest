<!DOCTYPE html>
<html lang="fr" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buzzer - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { font-family: 'Fredoka', sans-serif; transition: 0.3s; height: 100dvh; overflow: hidden; }
        .bento-card { border-radius: 28px; border: 4px solid #fff; box-shadow: 0 8px 0px rgba(0,0,0,0.05); }
        .dark .bento-card { background: #1e293b; border-color: #334155; color: white; }
        #drawer { transform: translateX(100%); transition: 0.4s ease; }
        #drawer.open { transform: translateX(0); }
        
        .buzzer-btn {
            transition: transform 0.1s;
            box-shadow: 0 15px 0px rgba(0,0,0,0.2);
        }
        .buzzer-btn:active {
            transform: scale(0.95) translateY(10px);
            box-shadow: 0 5px 0px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="bg-rose-50 dark:bg-slate-900 p-4 flex flex-col">

    <div class="flex justify-between items-center mb-6">
        <div class="bento-card bg-white px-4 py-2 font-bold text-rose-500">
            Score: <span id="my-score">0</span>
        </div>
        <button id="open-drawer" class="p-3 bg-white dark:bg-slate-800 rounded-2xl shadow-sm text-2xl">☰</button>
    </div>

    <!-- DRAWER -->
    <div id="drawer" class="fixed top-0 right-0 h-full w-72 bg-white dark:bg-slate-800 z-50 p-8 flex flex-col shadow-2xl">
        <button id="close-drawer" class="self-end text-xl dark:text-white">✕</button>
        <h2 class="text-xl font-bold mb-6 dark:text-white">Personnalisation</h2>
        
        <p class="text-sm font-bold text-gray-400 mb-2 uppercase">Couleur du Buzzer</p>
        <div class="grid grid-cols-4 gap-2 mb-8">
            <button onclick="changeColor('#ef4444')" class="w-10 h-10 bg-red-500 rounded-full border-2 border-white"></button>
            <button onclick="changeColor('#3b82f6')" class="w-10 h-10 bg-blue-500 rounded-full border-2 border-white"></button>
            <button onclick="changeColor('#10b981')" class="w-10 h-10 bg-emerald-500 rounded-full border-2 border-white"></button>
            <button onclick="changeColor('#f59e0b')" class="w-10 h-10 bg-amber-500 rounded-full border-2 border-white"></button>
        </div>

        <button id="toggle-dark" class="w-full p-4 mb-4 bg-gray-100 dark:bg-slate-700 rounded-2xl font-bold flex items-center justify-between dark:text-white">
            <span>Mode Nuit</span> <span id="dark-status">🌙</span>
        </button>
        <button id="btn-logout" class="mt-auto w-full p-4 bg-rose-500 text-white rounded-2xl font-bold">Quitter 🚪</button>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center gap-8">
        <div id="status-text" class="text-2xl font-bold dark:text-white text-center">
            Attente du Host...
        </div>

        <button id="main-buzzer" class="buzzer-btn w-64 h-64 bg-red-500 rounded-full border-[10px] border-white flex items-center justify-center">
            <span class="text-white font-black text-4xl italic select-none">BUZZ!</span>
        </button>

        <div id="feedback" class="h-8 font-bold text-gray-400 italic"></div>
    </div>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const roomId = new URLSearchParams(window.location.search).get('room');
        const buzzer = document.getElementById('main-buzzer');

        // DRAWER LOGIC
        document.getElementById('open-drawer').onclick = () => document.getElementById('drawer').classList.add('open');
        document.getElementById('close-drawer').onclick = () => document.getElementById('drawer').classList.remove('open');
        
        window.changeColor = (color) => {
            buzzer.style.backgroundColor = color;
            localStorage.setItem('buzzerColor', color);
        };
        if(localStorage.getItem('buzzerColor')) changeColor(localStorage.getItem('buzzerColor'));

        // GAME LOGIC
        auth.onAuthStateChanged(user => {
            if(!user) return window.location.href = 'Auth.html';
            
            const playerRef = ref(db, `rooms/${roomId}/players/${user.uid}`);
            onValue(playerRef, snap => {
                if(snap.exists()) document.getElementById('my-score').innerText = snap.val().score || 0;
            });

            buzzer.onclick = async () => {
                const roomSnap = await get(ref(db, `rooms/${roomId}`));
                if(roomSnap.val().state === 'playing') {
                    update(ref(db, `rooms/${roomId}`), {
                        state: 'buzzed',
                        buzzerId: user.uid,
                        buzzerName: user.displayName
                    });
                    if("vibrate" in navigator) navigator.vibrate(100);
                }
            };
        });

        onValue(ref(db, `rooms/${roomId}/state`), snap => {
            const state = snap.val();
            const status = document.getElementById('status-text');
            if(state === 'playing') {
                status.innerText = "À TOI DE JOUER !";
                buzzer.style.opacity = "1";
            } else {
                status.innerText = "Buzzer verrouillé 🔒";
                buzzer.style.opacity = "0.5";
            }
        });
    </script>
</body>
</html>
