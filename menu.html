<!DOCTYPE html>
<html lang="fr" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        body { font-family: 'Fredoka', sans-serif; transition: 0.3s; }
        .bento-card { border-radius: 32px; border: 4px solid #fff; box-shadow: 0 10px 0px rgba(0,0,0,0.05); }
        .dark .bento-card { background: #1e293b; border-color: #334155; color: white; }
        #drawer { transform: translateX(100%); transition: 0.4s ease; }
        #drawer.open { transform: translateX(0); }
    </style>
</head>
<body class="bg-rose-50 dark:bg-slate-900 min-h-screen p-6">

    <!-- TOP BAR -->
    <!-- test -->
    <div class="flex justify-between items-center max-w-4xl mx-auto mb-10">
        <h1 class="text-2xl font-bold dark:text-white">Blindtest <span class="text-rose-500">Party</span></h1>
        <button id="open-drawer" class="p-3 bg-white dark:bg-slate-800 rounded-2xl shadow-sm text-2xl">☰</button>
    </div>

    <!-- DRAWER -->
    <div id="drawer" class="fixed top-0 right-0 h-full w-72 bg-white dark:bg-slate-800 z-50 p-8 flex flex-col shadow-2xl">
        <button id="close-drawer" class="self-end text-xl dark:text-white">✕</button>
        <h2 class="text-xl font-bold mb-8 dark:text-white">Réglages</h2>
        
        <button id="toggle-dark" class="w-full p-4 mb-4 bg-gray-100 dark:bg-slate-700 rounded-2xl font-bold flex items-center justify-between dark:text-white">
            <span>Mode Nuit</span>
            <span id="dark-status">🌙</span>
        </button>

        <a href="Admin.html" id="admin-link" class="hidden w-full p-4 mb-4 bg-amber-100 text-amber-700 rounded-2xl font-bold text-center">Panel Admin 🛠️</a>

        <div class="mt-auto">
            <button id="btn-logout" class="w-full p-4 bg-rose-100 text-rose-600 rounded-2xl font-bold">Déconnexion 🚪</button>
        </div>
    </div>

    <!-- CONTENU MENU -->
    <div class="max-w-xl mx-auto space-y-6">
        <div class="bento-card bg-white p-8 text-center">
            <h2 class="text-2xl font-bold mb-4">Salut, <span id="user-name">...</span> !</h2>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="window.location.href='host.html'" class="p-6 bg-indigo-500 text-white rounded-3xl font-bold text-xl">CRÉER UNE PARTIE</button>
                <button onclick="window.location.href='player.html'" class="p-6 bg-emerald-500 text-white rounded-3xl font-bold text-xl">REJOINDRE</button>
                <button onclick="window.location.href='Upload.html'" class="p-6 bg-white dark:bg-slate-700 border-4 border-rose-200 rounded-3xl font-bold text-xl">BIBLIOTHÈQUE 🎶</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const drawer = document.getElementById('drawer');
        onAuthStateChanged(auth, (user) => {
            if(!user) window.location.href = 'Auth.html';
            document.getElementById('user-name').innerText = user.displayName;
            // Admin simple check (tu peux changer l'email)
            if(user.email === "tonadmin@mail.com") document.getElementById('admin-link').classList.remove('hidden');
        });

        // Toggle Drawer
        document.getElementById('open-drawer').onclick = () => drawer.classList.add('open');
        document.getElementById('close-drawer').onclick = () => drawer.classList.remove('open');

        // Dark Mode
        const toggleDark = document.getElementById('toggle-dark');
        toggleDark.onclick = () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('dark-status').innerText = isDark ? "☀️" : "🌙";
            localStorage.setItem('dark', isDark);
        };
        if(localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
