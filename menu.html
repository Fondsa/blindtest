<!DOCTYPE html>
<html lang="fr" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Blindtest Party 🎶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            background: linear-gradient(-45deg, #FFDEE9, #B5FFFC, #f0f4f8, #fdfcfb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100dvh; overflow-x: hidden;
            transition: background 0.3s;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .dark body { background: #0f172a; background-image: none; }

        .bento-card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 32px; border: 4px solid #ffffff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .bento-card:hover { transform: translateY(-5px); }
        .dark .bento-card { background: rgba(30, 41, 59, 0.9); border-color: #334155; color: white; }

        .floating-title {
            animation: floating 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(-1deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
        }

        #drawer { transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #drawer.open { transform: translateX(0); }
        
        .pastel-rose { background-color: #ffe4e6; color: #fb7185; }
        .pastel-bleu { background-color: #e0f2fe; color: #38bdf8; }
        .pastel-vert { background-color: #f0fdf4; color: #4ade80; }
    </style>
</head>
<body class="p-6 flex flex-col items-center">

    <!-- BARRE HAUTE -->
    <div class="w-full max-w-4xl flex justify-end mb-4">
        <button id="open-drawer" class="p-4 bento-card text-2xl">☰</button>
    </div>

    <!-- DRAWER -->
    <div id="drawer" class="fixed top-0 right-0 h-full w-72 bg-white dark:bg-slate-800 z-50 p-8 flex flex-col shadow-2xl">
        <button id="close-drawer" class="self-end text-2xl dark:text-white mb-8">✕</button>
        <h2 class="text-xl font-bold mb-6 dark:text-white uppercase tracking-widest">Réglages</h2>
        
        <div class="space-y-4">
            <button id="toggle-dark" class="w-full p-4 bg-gray-100 dark:bg-slate-700 rounded-2xl font-bold flex items-center justify-between dark:text-white">
                <span>Mode Nuit</span> <span id="dark-icon">🌙</span>
            </button>
            <a href="Admin.html" id="admin-btn" class="hidden w-full p-4 bg-amber-100 text-amber-700 rounded-2xl font-bold block text-center border-2 border-amber-200">Admin Panel 🛠️</a>
        </div>

        <button id="btn-logout" class="mt-auto w-full p-4 bg-rose-500 text-white rounded-2xl font-bold shadow-[0_4px_0_0_#be123c]">DÉCONNEXION 🚪</button>
    </div>

    <!-- TITRE -->
    <div class="text-center mb-10 mt-4">
        <h1 class="text-6xl md:text-8xl font-black text-gray-800 dark:text-white tracking-tighter floating-title">
            BLIND<span class="text-rose-400">TEST</span>
        </h1>
        <p class="text-gray-500 dark:text-gray-300 font-bold uppercase tracking-[0.3em] mt-2">Party Edition</p>
    </div>

    <!-- GRILLE BENTO -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
        
        <!-- Créer une Room -->
        <button onclick="createRoom()" class="bento-card pastel-rose md:col-span-2 flex flex-col items-center justify-center p-10">
            <span class="text-5xl mb-4">👑</span>
            <span class="text-2xl font-black">CRÉER UNE ROOM</span>
        </button>

        <!-- Rejoindre -->
        <div class="bento-card pastel-bleu flex flex-col items-center p-8 space-y-4">
            <span class="text-4xl">🕹️</span>
            <span class="text-xl font-bold text-center">REJOINDRE</span>
            <div class="flex gap-2 w-full mt-2">
                <input type="text" id="room-code" placeholder="CODE" maxlength="4" class="w-full p-3 rounded-xl border-none outline-none text-center font-bold text-gray-600 bg-white/50">
                <button onclick="joinRoom()" class="bg-sky-400 text-white px-4 rounded-xl font-bold">GO</button>
            </div>
        </div>

        <!-- Import -->
        <button onclick="window.location.href='Upload.html'" class="bento-card pastel-vert flex flex-col items-center justify-center p-8">
            <span class="text-4xl mb-2">🎶</span>
            <span class="text-xl font-bold">BIBLIOTHÈQUE</span>
        </button>

    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'index.html';
            // Email de l'admin à changer ici
            if(user.email === "tonadmin@mail.com") document.getElementById('admin-btn').classList.remove('hidden');
        });

        // Fonctions de Room
        window.createRoom = () => {
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            window.location.href = `host.html?room=${code}`;
        };

        window.joinRoom = () => {
            const code = document.getElementById('room-code').value.toUpperCase();
            if(code.length === 4) window.location.href = `player.html?room=${code}`;
            else alert("Entre un code de 4 lettres !");
        };

        // Drawer & Dark Mode
        const drw = document.getElementById('drawer');
        document.getElementById('open-drawer').onclick = () => drw.classList.add('open');
        document.getElementById('close-drawer').onclick = () => drw.classList.remove('open');

        document.getElementById('toggle-dark').onclick = () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('dark-icon').innerText = isDark ? "☀️" : "🌙";
            localStorage.setItem('dark', isDark);
        };
        if(localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
