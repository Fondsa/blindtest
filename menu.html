<!DOCTYPE html>
<html lang="fr" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; 
            height: 100dvh; 
            overflow: hidden; 
            display: flex; flex-direction: column; 
            background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        .dark #bg-container { display: none; }

        /* ☁️ NUAGES PASTEL */
        #bg-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1;
            overflow: hidden;
        }
        .cloud {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.6;
            animation: floatClouds 15s infinite alternate ease-in-out;
        }
        .cloud-pink { background: #ffdce0; width: 65vw; height: 65vw; top: -15%; left: -10%; }
        .cloud-blue { background: #dcf2ff; width: 75vw; height: 75vw; bottom: -20%; right: -5%; animation-delay: -4s; }
        .cloud-green { background: #dcffe4; width: 55vw; height: 55vw; top: 25%; left: 15%; animation-delay: -7s; }

        @keyframes floatClouds {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(8%, 8%) scale(1.05); }
        }

        /* 🎮 BOUTONS PHYSIQUES */
        .btn-game {
            border-radius: 28px;
            color: white;
            font-weight: 700;
            transition: all 0.2s ease;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-bottom: 6px solid rgba(0,0,0,0.15);
            text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
        }
        .btn-game:active { transform: translateY(4px); border-bottom-width: 2px; }

        .btn-host { background-color: #ff9aa2; }
        .btn-play { background-color: #a0c4ff; }
        .btn-import { background-color: #b9fbc0; }

        .dark .btn-game { border-bottom-color: rgba(255,255,255,0.1); }

        .bento-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
        }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }

        .floating-title { animation: bounce 4s ease-in-out infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        #drawer { transform: translateX(100%); transition: 0.3s ease; }
        #drawer.open { transform: translateX(0); }
    </style>
</head>
<body>

    <div id="bg-container">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
        <div class="cloud cloud-green"></div>
    </div>

    <div class="absolute top-4 right-4 z-20">
        <button id="open-drawer" class="w-12 h-12 bento-card flex items-center justify-center text-xl dark:text-white">☰</button>
    </div>

    <!-- Drawer -->
    <div id="drawer" class="fixed top-0 right-0 h-full w-64 bg-white/95 dark:bg-black/95 z-50 p-6 flex flex-col shadow-2xl">
        <button id="close-drawer" class="self-end text-xl mb-6 dark:text-white">✕</button>
        
        <div class="space-y-4">
            <!-- Thème -->
            <button id="toggle-dark" class="w-full p-4 bg-gray-100 dark:bg-zinc-900 rounded-2xl font-bold flex justify-between items-center dark:text-white text-sm">
                <span>Mode Nuit</span> <span id="dark-icon">🌙</span>
            </button>
            
            <!-- Administration (Masqué par défaut) -->
            <button id="admin-link" class="hidden w-full p-4 bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 rounded-2xl font-bold flex items-center justify-center gap-2 border-2 border-amber-200 dark:border-amber-800 text-sm">
                ADMINISTRATION 🛠️
            </button>
        </div>

        <button id="btn-logout" class="mt-auto w-full p-4 bg-zinc-200 dark:bg-zinc-800 dark:text-white rounded-2xl font-bold text-sm">DÉCONNEXION 🚪</button>
    </div>

    <main class="relative z-10 flex flex-col items-center justify-center h-full w-full p-6">
        
        <div class="text-center mb-8">
            <h1 class="text-6xl md:text-8xl font-black text-gray-800 dark:text-white tracking-tighter floating-title">
                BLIND<span class="text-pink-300">TEST</span>
            </h1>
        </div>

        <div class="grid grid-cols-2 gap-4 w-full max-w-lg">
            <!-- CRÉER UNE ROOM -->
            <button id="btn-create" class="btn-game btn-host col-span-2 py-8">
                <span class="text-5xl mb-2">👑</span>
                <span class="text-2xl font-black italic">CRÉER UNE ROOM</span>
            </button>

            <!-- REJOINDRE -->
            <div class="btn-game btn-play col-span-1 p-4">
                <span class="text-3xl mb-1">🕹️</span>
                <span class="text-sm font-black mb-3 text-white/90 uppercase">Rejoindre</span>
                <input type="text" id="room-code" placeholder="AZERT" maxlength="5" class="w-full p-2 rounded-xl border-none outline-none text-center font-bold text-gray-800 bg-white/90 uppercase text-sm mb-3">
                <button id="btn-go" class="w-full bg-white text-blue-400 py-2 rounded-xl font-black text-xs hover:bg-gray-50 transition-colors">GO</button>
            </div>

            <!-- BIBLIOTHÈQUE -->
            <button onclick="window.location.href='Upload.html'" class="btn-game btn-import col-span-1 p-4">
                <span class="text-4xl mb-2">🎶</span>
                <span class="text-sm font-black text-center uppercase">Bibliothèque</span>
            </button>
        </div>
    </main>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const adminLink = document.getElementById('admin-link');

        // Gestion de l'authentification et des droits Admin
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                // On garde l'ID joueur en local pour player.html
                localStorage.setItem('playerId', user.uid);
                
                // Vérification si l'utilisateur est admin dans la DB
                const userRef = ref(db, `users/${user.uid}`);
                const snapshot = await get(userRef);
                
                if (snapshot.exists() && snapshot.val().isAdmin === true) {
                    adminLink.classList.remove('hidden');
                    adminLink.onclick = () => window.location.href = 'Admin.html';
                }
            }
        });

        // Fonction Créer Room
        document.getElementById('btn-create').onclick = async () => {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let code = '';
            for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            
            const roomRef = ref(db, `rooms/${code}`);
            await set(roomRef, { 
                state: 'waiting', 
                host: auth.currentUser.uid, 
                createdAt: Date.now() 
            });
            window.location.href = `host.html?room=${code}`;
        };

       // Remplace ton ancienne fonction "btn-go" par celle-ci
document.getElementById('btn-go').onclick = async (e) => {
    e.preventDefault();
    const code = document.getElementById('room-code').value.toUpperCase().trim();
    
    if(code.length === 5) {
        if(auth.currentUser) {
            const uid = auth.currentUser.uid;
            
            // 1. Récupérer le pseudo de l'utilisateur (on suppose qu'il est dans users/uid)
            const userSnap = await get(ref(db, `users/${uid}`));
            const pseudo = userSnap.exists() ? userSnap.val().pseudo : "Joueur";
            const color = userSnap.exists() ? userSnap.val().color : "#ff9aa2";

            // 2. L'INSCRIRE dans la room sur Firebase
            // C'est cette étape qui fera bouger la liste chez le Host !
            await set(ref(db, `rooms/${code}/players/${uid}`), {
                pseudo: pseudo,
                color: color,
                ready: true // Optionnel
            });

            // 3. Une fois inscrit, on change de page
            localStorage.setItem('playerId', uid);
            window.location.href = `player.html?room=${code}`;
        }
    } else {
        alert("Entre un code à 5 lettres !");
    }
};
        // Gestion du Drawer
        const drw = document.getElementById('drawer');
        document.getElementById('open-drawer').onclick = () => drw.classList.add('open');
        document.getElementById('close-drawer').onclick = () => drw.classList.remove('open');

        // Dark Mode
        document.getElementById('toggle-dark').onclick = () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('dark-icon').innerText = isDark ? "☀️" : "🌙";
            localStorage.setItem('dark', isDark);
        };

        if(localStorage.getItem('dark') === 'true') {
            document.documentElement.classList.add('dark');
            document.getElementById('dark-icon').innerText = "☀️";
        }

        // Déconnexion
        document.getElementById('btn-logout').onclick = () => {
            signOut(auth).then(() => {
                localStorage.removeItem('playerId');
                window.location.href = 'index.html';
            });
        };
    </script>
</body>
</html>
