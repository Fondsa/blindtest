<!DOCTYPE html>
<html lang="fr" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; 
            height: 100dvh; 
            overflow: hidden; 
            display: flex; flex-direction: column; 
            background-color: #ffffff;
            transition: background-color 0.5s ease;
        }
        .dark body { background-color: #020617; }

        /* ☁️ NUAGES PLUS VISIBLES */
        #bg-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1;
            overflow: hidden;
        }
        .cloud {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px); /* Un peu moins de flou pour voir plus les couleurs */
            opacity: 0.85; /* Plus d'opacité */
            animation: floatClouds 12s infinite alternate ease-in-out;
        }
        .dark .cloud { mix-blend-mode: screen; } /* Pour que ça brille sur le noir */

        .cloud-1 { background: #ff99aa; width: 70vw; height: 70vw; top: -20%; left: -10%; }
        .cloud-2 { background: #7dd3fc; width: 80vw; height: 80vw; bottom: -25%; right: -10%; animation-delay: -4s; }
        .cloud-3 { background: #86efac; width: 50vw; height: 50vw; top: 20%; left: 20%; animation-delay: -8s; }

        @keyframes floatClouds {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.1); }
        }

        /* 🎮 BOUTONS STYLE JEU VIDÉO */
        .btn-game {
            border-radius: 24px;
            color: white;
            font-weight: 900;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-bottom: 6px solid rgba(0,0,0,0.2); /* Effet de profondeur */
        }
        .btn-game:active { transform: translateY(4px); border-bottom-width: 2px; }

        .btn-host { background-color: #ef4444; } /* ROUGE */
        .btn-play { background-color: #3b82f6; } /* BLEU */
        .btn-import { background-color: #22c55e; } /* VERT */

        /* 🍱 CARTES BENTO FLOTTANTES */
        .bento-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
        }
        .dark .bento-card { background: rgba(30, 41, 59, 0.4); border-color: rgba(255, 255, 255, 0.1); }

        .floating-title { animation: bounce 3s ease-in-out infinite; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        #drawer { transform: translateX(100%); transition: 0.3s ease; }
        #drawer.open { transform: translateX(0); }
    </style>
</head>
<body>

    <div id="bg-container">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <div class="absolute top-4 right-4 z-20">
        <button id="open-drawer" class="w-12 h-12 bento-card flex items-center justify-center text-xl font-bold dark:text-white">☰</button>
    </div>

    <div id="drawer" class="fixed top-0 right-0 h-full w-64 bg-white/95 dark:bg-slate-900/95 z-50 p-6 flex flex-col shadow-2xl">
        <button id="close-drawer" class="self-end text-xl mb-6 dark:text-white">✕</button>
        <div class="space-y-4">
            <button id="toggle-dark" class="w-full p-4 bg-gray-100 dark:bg-slate-800 rounded-2xl font-bold flex justify-between items-center dark:text-white">
                <span>Mode Nuit</span> <span id="dark-icon">🌙</span>
            </button>
            <a href="Admin.html" id="admin-btn" class="hidden w-full p-4 bg-amber-400 text-white rounded-2xl font-bold text-center">ADMIN 🛠️</a>
        </div>
        <button id="btn-logout" class="mt-auto w-full p-4 bg-gray-800 text-white rounded-2xl font-bold">DÉCONNEXION 🚪</button>
    </div>

    <main class="relative z-10 flex flex-col items-center justify-center h-full w-full p-6">
        
        <div class="text-center mb-8">
            <h1 class="text-6xl md:text-8xl font-black text-gray-800 dark:text-white tracking-tighter floating-title">
                BLIND<span class="text-rose-500">TEST</span>
            </h1>
        </div>

        <div class="grid grid-cols-2 gap-4 w-full max-w-lg">
            
            <!-- CRÉER UNE ROOM -->
            <button onclick="createRoom()" class="btn-game btn-host col-span-2 py-8">
                <span class="text-5xl mb-2">👑</span>
                <span class="text-2xl font-black italic">CRÉER UNE ROOM</span>
            </button>

            <!-- REJOINDRE -->
            <div class="btn-game btn-play col-span-1 p-4">
                <span class="text-3xl mb-1">🕹️</span>
                <span class="text-sm font-black mb-3">REJOINDRE</span>
                <input type="text" id="room-code" placeholder="AZERT" maxlength="5" class="w-full p-2 rounded-xl border-none outline-none text-center font-bold text-gray-800 bg-white uppercase text-sm mb-3">
                <button onclick="joinRoom()" class="w-full bg-white text-blue-600 py-2 rounded-xl font-black text-xs hover:bg-gray-100">VALIDER</button>
            </div>

            <!-- BIBLIOTHÈQUE -->
            <button onclick="window.location.href='Upload.html'" class="btn-game btn-import col-span-1 p-4">
                <span class="text-4xl mb-2">🎶</span>
                <span class="text-sm font-black text-center">BIBLIOTHÈQUE<br>MP3</span>
            </button>

        </div>
    </main>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'index.html';
            if(user && user.email === "tonadmin@mail.com") document.getElementById('admin-btn').classList.remove('hidden');
        });

        window.createRoom = async () => {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let code = '';
            for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            const roomRef = ref(db, `rooms/${code}`);
            await set(roomRef, { state: 'waiting', host: auth.currentUser.uid, createdAt: Date.now() });
            window.location.href = `host.html?room=${code}`;
        };

        window.joinRoom = () => {
            const code = document.getElementById('room-code').value.toUpperCase();
            if(code.length === 5) window.location.href = `player.html?room=${code}`;
            else alert("Code à 5 lettres !");
        };

        const drw = document.getElementById('drawer');
        document.getElementById('open-drawer').onclick = () => drw.classList.add('open');
        document.getElementById('close-drawer').onclick = () => drw.classList.remove('open');

        document.getElementById('toggle-dark').onclick = () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('dark-icon').innerText = isDark ? "☀️" : "🌙";
            localStorage.setItem('dark', isDark);
        };
        if(localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');
        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
