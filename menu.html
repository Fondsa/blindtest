<!DOCTYPE html>
<html lang="fr" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Blindtest Party 🎶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            /* Retour du fond magnifique */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100dvh; overflow-x: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .dark body { background: #0f172a; } /* Fond fixe en mode sombre pour le confort */

        .bento-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 32px; border: 4px solid #ffffff;
            box-shadow: 0 10px 0px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        .dark .bento-card { background: rgba(30, 41, 59, 0.8); border-color: #334155; color: white; }

        /* Titre qui bouge */
        .floating-title {
            animation: floating 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        #drawer { transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #drawer.open { transform: translateX(0); }
    </style>
</head>
<body class="p-6">

    <!-- DRAWER -->
    <div id="drawer" class="fixed top-0 right-0 h-full w-72 bg-white dark:bg-slate-800 z-50 p-8 flex flex-col shadow-2xl">
        <button id="close-drawer" class="self-end text-2xl dark:text-white">✕</button>
        <h2 class="text-xl font-bold mb-8 dark:text-white uppercase tracking-tighter">Réglages</h2>
        
        <div class="space-y-4">
            <button id="toggle-dark" class="w-full p-4 bg-gray-100 dark:bg-slate-700 rounded-2xl font-bold flex items-center justify-between dark:text-white">
                <span>Mode Nuit</span> <span id="dark-icon">🌙</span>
            </button>
            <a href="Admin.html" id="admin-btn" class="hidden w-full p-4 bg-amber-400 text-amber-900 rounded-2xl font-bold block text-center">Panel Admin 🛠️</a>
        </div>

        <button id="btn-logout" class="mt-auto w-full p-4 bg-rose-500 text-white rounded-2xl font-bold shadow-[0_4px_0_0_#be123c]">DÉCONNEXION 🚪</button>
    </div>

    <!-- CONTENU -->
    <div class="max-w-4xl mx-auto flex flex-col items-center">
        
        <div class="w-full flex justify-end mb-4">
            <button id="open-drawer" class="p-4 bg-white dark:bg-slate-800 rounded-2xl shadow-lg text-2xl">☰</button>
        </div>

        <div class="text-center mb-12">
            <h1 class="text-6xl md:text-8xl font-black text-white tracking-tighter floating-title drop-shadow-2xl">
                BLIND<span class="text-yellow-300">TEST</span>
            </h1>
            <p class="text-white font-bold text-xl opacity-90 mt-4 uppercase tracking-widest">Party Edition</p>
        </div>

        <div class="bento-card p-8 w-full max-w-md space-y-6">
            <div class="text-center mb-4">
                <p class="text-gray-500 dark:text-gray-400 font-bold uppercase text-xs tracking-widest">Connecté en tant que</p>
                <h2 id="user-display" class="text-2xl font-black text-rose-500 italic">...</h2>
            </div>

            <div class="grid gap-4">
                <button onclick="window.location.href='host.html'" class="py-5 bg-indigo-500 text-white rounded-2xl font-bold text-xl shadow-[0_6px_0_0_#4338ca] hover:scale-105 transition-transform">CRÉER UNE ROOM</button>
                <button onclick="window.location.href='player.html'" class="py-5 bg-emerald-500 text-white rounded-2xl font-bold text-xl shadow-[0_6px_0_0_#059669] hover:scale-105 transition-transform">REJOINDRE</button>
                <button onclick="window.location.href='Upload.html'" class="py-5 bg-white dark:bg-slate-700 border-4 border-rose-200 text-rose-500 dark:text-rose-300 rounded-2xl font-bold text-xl hover:scale-105 transition-transform">IMPORT MP3 🎶</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Redirection si pas connecté
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'index.html'; // index.html est ton Auth.html maintenant
            document.getElementById('user-display').innerText = user.displayName;
            if(user.email === "tonadmin@mail.com") document.getElementById('admin-btn').classList.remove('hidden');
        });

        // Drawer
        const drw = document.getElementById('drawer');
        document.getElementById('open-drawer').onclick = () => drw.classList.add('open');
        document.getElementById('close-drawer').onclick = () => drw.classList.remove('open');

        // Dark Mode
        document.getElementById('toggle-dark').onclick = () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('dark-icon').innerText = isDark ? "☀️" : "🌙";
            localStorage.setItem('dark', isDark);
        };
        if(localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
