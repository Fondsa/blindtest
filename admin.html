<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hôte - Blind Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fredoka One', cursive; }</style>
</head>
<body class="bg-indigo-50 p-4 min-h-screen">
    <div class="max-w-2xl mx-auto flex justify-between items-center mb-6">
        <a href="index.html" class="bg-white px-4 py-2 rounded-xl shadow text-indigo-600 hover:bg-indigo-100 transition-all font-bold">← Menu</a>
        <button id="btn-quit" class="bg-red-100 px-4 py-2 rounded-xl text-red-600 font-bold hover:bg-red-200 transition-all">Quitter Room ×</button>
    </div>

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl border-4 border-indigo-500 overflow-hidden">
        <div class="bg-indigo-500 p-6 text-white text-center">
            <p class="text-xs uppercase opacity-70 tracking-widest">Code de ta Room</p>
            <h1 id="room-display" class="text-5xl font-black mb-2 tracking-widest">-----</h1>
        </div>

        <div class="p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-2">1. THÈME</label>
                    <select id="theme-select" class="w-full p-3 bg-gray-100 rounded-xl outline-none focus:ring-4 ring-indigo-200">
                        <option value="">-- Choisir --</option>
                        <option value="animes">🇯🇵 Animes</option>
                        <option value="disney">🏰 Disney</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-2">2. MUSIQUE</label>
                    <select id="music-select" class="w-full p-3 bg-gray-100 rounded-xl outline-none" disabled></select>
                </div>
            </div>

            <div class="flex gap-4">
                <button id="btn-play" class="flex-1 bg-green-500 text-white py-5 rounded-2xl shadow-[0_6px_0_0_#16a34a] active:translate-y-1 active:shadow-none transition-all text-xl font-bold uppercase">Lancer</button>
                <button id="btn-reset" class="flex-1 bg-red-500 text-white py-5 rounded-2xl shadow-[0_6px_0_0_#dc2626] active:translate-y-1 active:shadow-none transition-all text-xl font-bold uppercase">Reset</button>
            </div>

            <div id="buzz-display" class="hidden">
                <div class="bg-yellow-400 border-4 border-yellow-600 p-8 rounded-3xl text-center shadow-2xl animate-bounce">
                    <p class="text-yellow-900 uppercase font-black">LE PLUS RAPIDE :</p>
                    <p id="winner-name" class="text-5xl text-indigo-900 mt-2 font-black uppercase">---</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const library = {
            animes: [{ name: "Naruto", file: "musiques/animes/naruto.mp3" }],
            disney: [{ name: "Roi Lion", file: "musiques/disney/roilion.mp3" }]
        };

        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const roomRef = ref(db, 'rooms/' + roomId);
        const audio = new Audio();

        if(!roomId) window.location.href = "index.html";
        document.getElementById('room-display').innerText = roomId;

        onAuthStateChanged(getAuth(), (u) => { if(!u) window.location.href="index.html"; });

        document.getElementById('theme-select').onchange = (e) => {
            const list = library[e.target.value] || [];
            document.getElementById('music-select').disabled = list.length === 0;
            document.getElementById('music-select').innerHTML = '<option value="">-- Musique --</option>' + 
                list.map(m => `<option value="${m.file}">${m.name}</option>`).join('');
        };

        document.getElementById('music-select').onchange = (e) => { audio.src = e.target.value; };
        document.getElementById('btn-play').onclick = () => { update(roomRef, { state: 'playing', winner: null }); audio.play(); };
        document.getElementById('btn-reset').onclick = () => update(roomRef, { state: 'waiting', winner: null });
        document.getElementById('btn-quit').onclick = () => { if(confirm("Fermer la room ?")) { remove(roomRef); window.location.href="index.html"; }};

        onValue(roomRef, (snap) => {
            const data = snap.val();
            if (data?.state === 'buzzed') {
                audio.pause();
                document.getElementById('buzz-display').classList.remove('hidden');
                document.getElementById('winner-name').innerText = data.winner;
            } else { document.getElementById('buzz-display').classList.add('hidden'); }
        });
    </script>
</body>
</html>
