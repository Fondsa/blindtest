<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hôte - Blindtest Party 🎶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Fredoka', sans-serif;
            background-color: #FFDEE9;
            background-image: linear-gradient(0deg, #FFDEE9 0%, #B5FFFC 100%);
            background-attachment: fixed;
        }
        
        .bento-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 0px rgba(0,0,0,0.05);
        }

        .btn-game {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-game:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: none !important;
        }

        /* Scrollbar Fun */
        #music-list-container::-webkit-scrollbar { width: 8px; }
        #music-list-container::-webkit-scrollbar-thumb {
            background: #FFB7B2;
            border-radius: 20px;
        }

        .track-item {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .track-item:hover {
            background-color: #fff4f4;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- HEADER RESPONSIVE -->
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="bento-card p-4 flex items-center gap-4 bg-yellow-300 border-yellow-400">
                <span class="text-4xl">🎮</span>
                <div>
                    <p class="text-xs font-bold uppercase opacity-60">Ta Room</p>
                    <h1 id="room-display" class="text-3xl font-bold text-yellow-900 tracking-tighter">...</h1>
                </div>
            </div>
            
            <a href="index.html" class="btn-game bg-white px-6 py-3 rounded-full font-bold text-rose-500 shadow-[0_4px_0_0_#fda4af] hover:bg-rose-50">
                Quitter la fête 👋
            </a>
        </div>

        <!-- ZONE PRINCIPALE -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- COLONNE GAUCHE : SÉLECTION (Responsive: prend toute la place sur mobile) -->
            <div class="lg:col-span-7 space-y-6">
                <div class="bento-card p-6">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <span>🎯</span> Choisis tes sons
                    </h2>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        <select id="theme-select" class="w-full p-4 rounded-2xl bg-rose-50 border-2 border-rose-100 font-bold text-rose-600 outline-none focus:border-rose-400">
                            <option value="">🌈 Thème</option>
                            <option value="animes">Animes</option>
                        </select>
                        <select id="series-select" disabled class="w-full p-4 rounded-2xl bg-blue-50 border-2 border-blue-100 font-bold text-blue-600 outline-none focus:border-blue-400 disabled:opacity-50">
                            <option value="">🎬 Série</option>
                        </select>
                    </div>

                    <input id="search-bar" type="text" placeholder="Rechercher une musique..." 
                           class="w-full p-4 mb-4 rounded-2xl bg-gray-50 border-2 border-gray-100 font-medium outline-none focus:border-purple-400">

                    <div id="music-list-container" class="h-72 overflow-y-auto space-y-2 pr-2">
                        <!-- Les musiques arrivent ici -->
                        <div class="text-center py-10 text-gray-400 italic">
                            Sélectionne un thème pour commencer à mixer !
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLONNE DROITE : CONTRÔLES (Fixe ou empilée) -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- PLAYER CARD -->
                <div class="bento-card p-8 text-center bg-white relative overflow-hidden">
                    <div id="current-track-display" class="text-lg font-bold text-purple-600 mb-6 min-h-[3rem] flex items-center justify-center">
                        Choisis un morceau ! 🎵
                    </div>

                    <div class="space-y-4">
                        <button id="btn-main-play" disabled class="btn-game w-full py-6 bg-green-400 hover:bg-green-300 text-green-900 rounded-[2rem] text-2xl font-bold shadow-[0_8px_0_0_#34d399] disabled:opacity-30">
                            LANCER ! 🚀
                        </button>
                        
                        <div class="flex gap-3">
                            <button id="btn-pause" class="btn-game hidden flex-1 py-4 bg-orange-300 text-orange-900 rounded-2xl font-bold shadow-[0_4px_0_0_#fb923c]">
                                Pause ⏸
                            </button>
                            <button id="btn-reset" class="btn-game flex-1 py-4 bg-rose-400 text-rose-900 rounded-2xl font-bold shadow-[0_4px_0_0_#f43f5e]">
                                Reset 🔄
                            </button>
                        </div>
                    </div>
                </div>

                <!-- BUZZER LOG (Petit clin d'œil convial) -->
                <div class="bento-card p-6 bg-purple-500 text-white">
                    <h3 class="font-bold mb-2 flex items-center gap-2">
                        <span>⚡</span> État du Buzz
                    </h3>
                    <div id="buzz-status" class="text-sm opacity-90 italic">
                        En attente du premier champion...
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const BASE_URL = "https://raw.githubusercontent.com/Fondsa/blindtest/main/musiques/anime/";
        const library = {
            animes: {
                "One Piece": [
                    { name: "One Piece - Opening 26", file: "https://raw.githubusercontent.com/Fondsa/blindtest/main/musiques/anime/OnePiece_op26.mp3" }
                ],
                "Violet Evergarden": [ 
                    { name: "Violet Evergarden - Opening 1", file: BASE_URL + encodeURIComponent("[4K  60FPS] Violet Evergarden Opening Creditless-[AudioTrimmer.com].mp3") } 
                ],
                "Nagatoro": [ 
                    { name: "Nagatoro - Opening 1", file: BASE_URL + encodeURIComponent("Arrête de me chauffer, Nagatoro - Opening  EASY LOVE-[AudioTrimmer.com].mp3") } 
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const audio = new Audio();
        let selectedTrack = null;

        if(!roomId) {
            window.location.href = "index.html";
        } else {
            document.getElementById('room-display').innerText = roomId;
            const roomRef = ref(db, 'rooms/' + roomId);

            const themeSelect = document.getElementById('theme-select');
            const seriesSelect = document.getElementById('series-select');
            const searchBar = document.getElementById('search-bar');
            const listContainer = document.getElementById('music-list-container');
            const btnMain = document.getElementById('btn-main-play');
            const btnPause = document.getElementById('btn-pause');
            const buzzStatus = document.getElementById('buzz-status');

            themeSelect.onchange = () => {
                const theme = themeSelect.value;
                seriesSelect.innerHTML = '<option value="">🎬 Série</option>';
                if(theme && library[theme]) {
                    seriesSelect.disabled = false;
                    Object.keys(library[theme]).forEach(s => {
                        seriesSelect.innerHTML += `<option value="${s}">${s}</option>`;
                    });
                } else { seriesSelect.disabled = true; }
                renderMusicList();
            };

            seriesSelect.onchange = renderMusicList;
            searchBar.oninput = renderMusicList;

            function renderMusicList() {
                const theme = themeSelect.value;
                const series = seriesSelect.value;
                const search = searchBar.value.toLowerCase();
                listContainer.innerHTML = "";
                
                if (!theme) {
                    listContainer.innerHTML = `<div class="text-center py-10 text-gray-400 italic">Sélectionne un thème pour commencer !</div>`;
                    return;
                }

                let tracks = [];
                if (series) tracks = library[theme][series];
                else Object.values(library[theme]).forEach(t => tracks = [...tracks, ...t]);

                const filtered = tracks.filter(t => t.name.toLowerCase().includes(search));
                
                filtered.forEach(track => {
                    const div = document.createElement('div');
                    div.className = "track-item p-4 bg-white border-2 border-transparent rounded-2xl font-bold flex justify-between items-center shadow-sm hover:border-purple-300";
                    div.innerHTML = `<span>${track.name}</span><span class="text-2xl">🎵</span>`;
                    div.onclick = () => {
                        selectedTrack = track;
                        audio.src = track.file;
                        audio.load();
                        document.getElementById('current-track-display').innerText = "Prêt pour : " + track.name;
                        btnMain.disabled = false;
                        document.querySelectorAll('.track-item').forEach(d => d.classList.remove('border-purple-500', 'bg-purple-50'));
                        div.classList.add('border-purple-500', 'bg-purple-50');
                    };
                    listContainer.appendChild(div);
                });
            }

            btnMain.onclick = () => {
                audio.play();
                update(roomRef, { state: 'playing', buzzList: null });
                btnMain.innerText = "C'EST PARTI ! 🔥";
                btnMain.classList.replace('bg-green-400', 'bg-purple-400');
                btnPause.classList.remove('hidden');
                buzzStatus.innerText = "La musique tourne... Attention aux buzz !";
            };

            btnPause.onclick = () => {
                if (audio.paused) { audio.play(); btnPause.innerText = "Pause ⏸"; }
                else { audio.pause(); btnPause.innerText = "Reprendre ▶️"; }
            };

            document.getElementById('btn-reset').onclick = () => {
                update(roomRef, { state: 'waiting', buzzList: null });
                audio.pause(); audio.currentTime = 0;
                btnMain.innerText = "LANCER ! 🚀";
                btnMain.classList.replace('bg-purple-400', 'bg-green-400');
                btnPause.classList.add('hidden');
                buzzStatus.innerText = "Room réinitialisée.";
            };

            onValue(roomRef, (snap) => {
                const data = snap.val();
                if (data?.state === 'buzzed') {
                    audio.pause();
                    buzzStatus.innerText = "BOUM ! Quelqu'un a buzzé ! ⚡";
                }
            });
        }
    </script>
</body>
</html>
