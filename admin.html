<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hôte - Blind Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fredoka One', cursive; }</style>
</head>
<body class="bg-indigo-50 p-4 min-h-screen">
    <div class="max-w-2xl mx-auto flex justify-between items-center mb-6">
        <a href="index.html" class="bg-white px-4 py-2 rounded-xl shadow text-indigo-600 hover:bg-indigo-100 transition-all font-bold">← Quitter</a>
    </div>

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl border-4 border-indigo-500 overflow-hidden">
        <!-- HEADER CLICABLE POUR COPIER LE CODE -->
        <div id="copy-container" class="bg-indigo-500 p-8 text-white text-center cursor-pointer hover:bg-indigo-600 transition-all active:scale-95 group">
            <p class="text-[10px] uppercase opacity-70 tracking-[0.3em] mb-2 font-bold">Code de la Room (Clique pour copier)</p>
            <h1 id="room-display" class="text-6xl font-black tracking-widest drop-shadow-md">-----</h1>
            <p id="copy-msg" class="text-xs mt-3 font-bold text-yellow-300 opacity-0 transition-opacity">COPIÉ DANS LE PRESSE-PAPIER !</p>
        </div>

        <div class="p-8 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-black text-gray-400 mb-2 uppercase">Catégorie</label>
                    <select id="theme-select" class="w-full p-4 bg-indigo-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none font-bold transition-all">
                        <option value="">-- SÉLECTIONNE --</option>
                        <option value="animes">🇯🇵 ANIMES</option>
                        <option value="disney">🏰 DISNEY</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-black text-gray-400 mb-2 uppercase">Titre</label>
                    <select id="music-select" class="w-full p-4 bg-indigo-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none font-bold transition-all disabled:opacity-30" disabled></select>
                </div>
            </div>

            <div class="flex gap-4">
                <button id="btn-play" class="flex-1 bg-green-500 text-white py-6 rounded-2xl shadow-[0_6px_0_0_#16a34a] active:translate-y-1 active:shadow-none transition-all text-2xl font-black uppercase">Lancer</button>
                <button id="btn-reset" class="flex-1 bg-red-500 text-white py-6 rounded-2xl shadow-[0_6px_0_0_#dc2626] active:translate-y-1 active:shadow-none transition-all text-2xl font-black uppercase">Reset</button>
            </div>

            <div id="buzz-zone" class="hidden">
                <div class="bg-yellow-400 border-4 border-yellow-600 p-8 rounded-3xl text-center shadow-2xl animate-bounce">
                    <p class="text-yellow-900 font-black text-sm uppercase">Ça a buzzé !</p>
                    <p id="winner-name" class="text-5xl text-indigo-900 mt-2 font-black uppercase">---</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // TA LIBRARY (A METTRE À JOUR ICI)
        const library = {
            animes: [{ name: "Naruto", file: "musiques/animes/naruto.mp3" }],
            disney: []
        };

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const roomRef = ref(db, 'rooms/' + roomId);
        const audio = new Audio();

        if(!roomId) window.location.href = "index.html";
        document.getElementById('room-display').innerText = roomId;

        // Logique de copie
        document.getElementById('copy-container').onclick = () => {
            navigator.clipboard.writeText(roomId);
            const msg = document.getElementById('copy-msg');
            msg.classList.remove('opacity-0');
            setTimeout(() => msg.classList.add('opacity-0'), 2000);
        };

        // Initialisation de la room
        update(roomRef, { state: 'waiting', winner: null });

        document.getElementById('theme-select').onchange = (e) => {
            const tracks = library[e.target.value] || [];
            const mSelect = document.getElementById('music-select');
            mSelect.disabled = tracks.length === 0;
            mSelect.innerHTML = '<option value="">-- MUSIQUE --</option>' + 
                tracks.map(t => `<option value="${t.file}">${t.name}</option>`).join('');
        };

        document.getElementById('music-select').onchange = (e) => { audio.src = e.target.value; };
        document.getElementById('btn-play').onclick = () => { update(roomRef, { state: 'playing', winner: null }); audio.play(); };
        document.getElementById('btn-reset').onclick = () => { update(roomRef, { state: 'waiting', winner: null }); audio.pause(); audio.currentTime = 0; };

        onValue(roomRef, (snap) => {
            const data = snap.val();
            if (data?.state === 'buzzed') {
                audio.pause();
                document.getElementById('buzz-zone').classList.remove('hidden');
                document.getElementById('winner-name').innerText = data.winner;
            } else { document.getElementById('buzz-zone').classList.add('hidden'); }
        });
    </script>
</body>
</html>
