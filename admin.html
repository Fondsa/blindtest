<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hôte - Blindtest Party</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fredoka One', cursive; }</style>
</head>
<body class="bg-indigo-50 p-4 min-h-screen">

    <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-xl border-4 border-indigo-500 overflow-hidden mt-10">
        <div class="bg-indigo-500 p-4 text-white text-center">
            <p class="text-[10px] uppercase opacity-70 font-bold">Code Room</p>
            <h1 id="room-display" class="text-4xl font-black italic">...</h1>
        </div>

        <div class="p-6 space-y-6">
            <!-- FILTRES -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <select id="theme-select" class="p-3 bg-indigo-50 rounded-xl font-bold outline-none border-2 border-transparent focus:border-indigo-500">
                    <option value="">-- THÈME --</option>
                    <option value="animes">ANIMES</option>
                </select>
                <select id="series-select" disabled class="p-3 bg-indigo-50 rounded-xl font-bold outline-none disabled:opacity-30 border-2 border-transparent focus:border-indigo-500">
                    <option value="">-- SÉRIE --</option>
                </select>
                <input id="search-bar" type="text" placeholder="Rechercher..." class="p-3 bg-indigo-50 rounded-xl font-bold outline-none border-2 border-transparent focus:border-indigo-500">
            </div>

            <!-- LISTE MUSIQUES -->
            <div id="music-list-container" class="bg-indigo-50 rounded-2xl p-4 min-h-[150px] max-h-60 overflow-y-auto border-2 border-indigo-100 text-gray-400 text-center italic text-sm">
                Sélectionne un thème pour commencer
            </div>

            <!-- CONTROLES -->
            <div class="text-center space-y-4">
                <div id="current-track-display" class="text-indigo-600 font-black text-sm uppercase px-4 truncate">Aucun titre choisi</div>
                <button id="btn-main-play" disabled class="w-full bg-green-500 text-white py-5 rounded-2xl shadow-[0_6px_0_0_#16a34a] active:translate-y-1 active:shadow-none transition-all text-xl font-black uppercase italic disabled:opacity-30">Lancer</button>
                <div class="flex gap-4">
                    <button id="btn-pause" class="hidden flex-1 bg-yellow-400 text-indigo-900 py-3 rounded-xl font-black uppercase text-sm">Pause</button>
                    <button id="btn-reset" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-black uppercase text-sm">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // 1. LES IMPORTS (TOUJOURS EN PREMIER)
        import { db } from './firebase-config.js';
        import { ref, update, onValue, increment, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 2. TA BIBLIOTHÈQUE GITHUB
        const BASE_URL = "https://raw.githubusercontent.com/Fondsa/blindtest/main/musiques/anime/";
        const library = {
    animes: {
        "One Piece": [
            { 
                name: "One Piece - Opening 26 - Uuuuus!", 
                file: "https://raw.githubusercontent.com/Fondsa/blindtest/main/musiques/anime/OnePiece_op26.mp3"
            }
        
        ]
        "Violet Evergarden": [ { name: "Violet Evergarden - Opening 1", film: "https://raw.githubusercontent.com/Fondsa/blindtest/main/musiques/anime/[4K  60FPS] Violet Evergarden Opening Creditless-[AudioTrimmer.com].mp3" } ]
        "Nagatoro": [ { name: "Nagatoro - Opening 1", film: "https://raw.githubusercontent.com/Fondsa/blindtest/main/musiques/anime/Arrête de me chauffer, Nagatoro - Opening  EASY LOVE-[AudioTrimmer.com].mp3" } ]
    }
};

        // 3. VARIABLES GLOBALES
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const audio = new Audio();
        let selectedTrack = null;

        if(!roomId) {
            window.location.href = "index.html";
        } else {
            // Affichage immédiat
            document.getElementById('room-display').innerText = roomId;

            const roomRef = ref(db, 'rooms/' + roomId);
            const countRef = ref(db, 'rooms/' + roomId + '/playerCount');

            // Création de la room sur Firebase
            update(roomRef, { state: 'waiting', buzzList: null }).catch(e => console.error("FB Error:", e));
            onDisconnect(countRef).set(increment(-1));

            // DOM Elements
            const themeSelect = document.getElementById('theme-select');
            const seriesSelect = document.getElementById('series-select');
            const searchBar = document.getElementById('search-bar');
            const listContainer = document.getElementById('music-list-container');
            const btnMain = document.getElementById('btn-main-play');
            const btnPause = document.getElementById('btn-pause');

            // GESTION DES FILTRES
            themeSelect.onchange = () => {
                const theme = themeSelect.value;
                seriesSelect.innerHTML = '<option value="">-- SÉRIE --</option>';
                if(theme && library[theme]) {
                    seriesSelect.disabled = false;
                    Object.keys(library[theme]).forEach(s => {
                        seriesSelect.innerHTML += `<option value="${s}">${s}</option>`;
                    });
                } else { seriesSelect.disabled = true; }
                renderMusicList();
            };

            seriesSelect.onchange = renderMusicList;
            searchBar.oninput = renderMusicList;

            function renderMusicList() {
                const theme = themeSelect.value;
                const series = seriesSelect.value;
                const search = searchBar.value.toLowerCase();
                listContainer.innerHTML = "";
                
                if (!theme) {
                    listContainer.innerHTML = "Sélectionne un thème pour commencer";
                    return;
                }

                let tracks = [];
                if (series) tracks = library[theme][series];
                else Object.values(library[theme]).forEach(t => tracks = [...tracks, ...t]);

                const filtered = tracks.filter(t => t.name.toLowerCase().includes(search));
                
                if(filtered.length === 0) {
                    listContainer.innerHTML = "Aucun titre trouvé";
                    return;
                }

                filtered.forEach(track => {
                    const div = document.createElement('div');
                    div.className = "p-3 mb-2 bg-white border-2 border-transparent rounded-xl font-bold cursor-pointer hover:border-indigo-500 hover:text-indigo-600 transition-all text-left shadow-sm";
                    div.innerText = track.name;
                    div.onclick = () => {
    selectedTrack = track;
    
    // On nettoie le lien au cas où
    const cleanURL = track.file.trim();
    console.log("Tentative de lecture de :", cleanURL);
    
    audio.src = cleanURL;
    audio.load();
    
    document.getElementById('current-track-display').innerText = "PRÊT : " + track.name;
    btnMain.disabled = false;

    document.querySelectorAll('#music-list-container div').forEach(d => d.classList.remove('border-indigo-500', 'bg-indigo-50'));
    div.classList.add('border-indigo-500', 'bg-indigo-50');
};
                    listContainer.appendChild(div);
                });
            }

            // CONTROLES
            btnMain.onclick = () => {
                audio.play().catch(e => alert("Erreur lecture : " + e.message));
                update(roomRef, { state: 'playing', buzzList: null });
                btnMain.innerText = "EN LECTURE...";
                btnMain.classList.replace('bg-green-500', 'bg-blue-500');
                btnPause.classList.remove('hidden');
            };

            btnPause.onclick = () => {
                if (audio.paused) { audio.play(); btnPause.innerText = "Pause"; }
                else { audio.pause(); btnPause.innerText = "Reprendre"; }
            };

            document.getElementById('btn-reset').onclick = () => {
                update(roomRef, { state: 'waiting', buzzList: null });
                audio.pause(); audio.currentTime = 0;
                btnMain.innerText = "Lancer";
                btnMain.classList.replace('bg-blue-500', 'bg-green-500');
                btnPause.classList.add('hidden');
            };

            // ÉCOUTE DES BUZZ
            onValue(roomRef, (snap) => {
                const data = snap.val();
                if (data?.buzzList) {
                    const sorted = Object.values(data.buzzList).sort((a, b) => a.time - b.time);
                    if (sorted.length === 1 && data.state === 'playing') {
                        audio.pause();
                        update(roomRef, { state: 'buzzed' });
                    }
                }
            });
        }
    </script>
</body>
</html>
