<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administration - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; height: 100dvh; overflow: hidden; 
            display: flex; flex-direction: column; background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        .dark #bg-container { display: none; }

        /* ☁️ NUAGES PASTEL */
        #bg-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1;
            overflow: hidden;
        }
        .cloud {
            position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6;
            animation: floatClouds 15s infinite alternate ease-in-out;
        }
        .cloud-pink { background: #ffdce0; width: 65vw; height: 65vw; top: -15%; left: -10%; }
        .cloud-blue { background: #dcf2ff; width: 75vw; height: 75vw; bottom: -20%; right: -5%; }

        @keyframes floatClouds { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }

        /* 🍱 BENTO CARDS */
        .bento-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
        }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }

        .btn-action {
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.7rem;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        #user-list {
            scrollbar-width: none;
        }
        #user-list::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="bg-container">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
    </div>

    <main class="relative z-10 flex flex-col h-full w-full p-6">
        
        <!-- HEADER -->
        <div class="flex items-center justify-between mb-8">
            <button onclick="window.location.href='menu.html'" class="bento-card p-3 text-xl">🏠</button>
            <h1 class="text-3xl font-black text-gray-800 dark:text-white italic tracking-tighter">ADMIN<span class="text-rose-400"> PANEL</span></h1>
            <div class="w-12"></div> <!-- Spacer -->
        </div>

        <!-- STATS RAPIDES -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bento-card p-4 text-center">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Total Joueurs</p>
                <p id="stat-total" class="text-3xl font-black dark:text-white">0</p>
            </div>
            <div class="bento-card p-4 text-center">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Admins</p>
                <p id="stat-admins" class="text-3xl font-black text-amber-500">0</p>
            </div>
        </div>

        <!-- LISTE DES UTILISATEURS -->
        <div class="flex-1 bento-card p-6 overflow-hidden flex flex-col">
            <h3 class="text-sm font-black text-gray-700 dark:text-gray-200 mb-4 uppercase tracking-widest">Gestion des Utilisateurs</h3>
            <div id="user-list" class="flex-1 overflow-y-auto space-y-3">
                <!-- Les utilisateurs seront injectés ici -->
                <p class="text-center text-gray-400 italic text-sm mt-10">Chargement de la base...</p>
            </div>
        </div>

        <p class="text-center text-[10px] text-gray-400 font-bold mt-4 uppercase tracking-widest">Blindtest Admin Mode • 2024</p>

    </main>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        if (localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        // SÉCURITÉ : Vérifier si l'utilisateur est bien Admin avant d'afficher la liste
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const userRef = ref(db, `users/${user.uid}`);
            const snap = await get(userRef);
            
            if (!snap.exists() || snap.val().isAdmin !== true) {
                alert("Accès refusé !");
                window.location.href = 'menu.html';
                return;
            }

            // Si ok, on charge la liste
            loadUsers();
        });

        function loadUsers() {
            const usersRef = ref(db, 'users');
            onValue(usersRef, (snapshot) => {
                const list = document.getElementById('user-list');
                const totalText = document.getElementById('stat-total');
                const adminsText = document.getElementById('stat-admins');
                
                list.innerHTML = "";
                
                if (snapshot.exists()) {
                    const users = snapshot.val();
                    const entries = Object.entries(users);
                    
                    totalText.innerText = entries.length;
                    let adminCount = 0;

                    entries.forEach(([id, data]) => {
                        if(data.isAdmin) adminCount++;

                        const card = document.createElement('div');
                        card.className = "flex items-center justify-between p-4 bg-white/60 dark:bg-zinc-900/50 rounded-2xl border-b-4 border-black/5";
                        
                        card.innerHTML = `
                            <div>
                                <p class="font-black text-sm dark:text-white uppercase tracking-tight">${data.pseudo || 'Anonyme'}</p>
                                <p class="text-[10px] text-gray-400 font-bold">${id.substring(0, 8)}...</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="toggleAdmin('${id}', ${data.isAdmin || false})" 
                                    class="btn-action ${data.isAdmin ? 'bg-amber-500 text-white' : 'bg-gray-200 dark:bg-zinc-800 text-gray-500'}">
                                    ${data.isAdmin ? 'Admin' : 'Promouvoir'}
                                </button>
                            </div>
                        `;
                        list.appendChild(card);
                    });
                    adminsText.innerText = adminCount;
                }
            });
        }

        // Fonction pour changer le rôle
        window.toggleAdmin = (userId, currentStatus) => {
            const newStatus = !currentStatus;
            const confirmMsg = newStatus ? "Promouvoir cet utilisateur en Admin ?" : "Retirer les droits Admin ?";
            
            if(confirm(confirmMsg)) {
                update(ref(db, `users/${userId}`), { isAdmin: newStatus });
            }
        };
    </script>
</body>
</html>
