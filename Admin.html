<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administration - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; height: 100dvh; overflow: hidden; 
            display: flex; flex-direction: column; background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        .dark #bg-container { display: none; }

        #bg-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1;
            overflow: hidden;
        }
        .cloud {
            position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6;
            animation: floatClouds 15s infinite alternate ease-in-out;
        }
        .cloud-pink { background: #ffdce0; width: 65vw; height: 65vw; top: -15%; left: -10%; }
        .cloud-blue { background: #dcf2ff; width: 75vw; height: 75vw; bottom: -20%; right: -5%; }

        @keyframes floatClouds { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }

        .bento-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
        }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }

        .btn-action {
            padding: 8px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.65rem;
            transition: all 0.2s;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        #user-list::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="bg-container">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
    </div>

    <main class="relative z-10 flex flex-col h-full w-full p-6">
        
        <div class="flex items-center justify-between mb-6">
            <button onclick="window.location.href='menu.html'" class="bento-card w-12 h-12 flex items-center justify-center text-xl">🏠</button>
            <h1 class="text-2xl font-black text-gray-800 dark:text-white italic tracking-tighter uppercase">Admin<span class="text-rose-400">Panel</span></h1>
            <div class="w-12"></div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bento-card p-4 text-center">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Joueurs</p>
                <p id="stat-total" class="text-2xl font-black dark:text-white">0</p>
            </div>
            <div class="bento-card p-4 text-center">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Admins</p>
                <p id="stat-admins" class="text-2xl font-black text-amber-500">0</p>
            </div>
        </div>

        <div class="flex-1 bento-card p-5 overflow-hidden flex flex-col">
            <h3 class="text-xs font-black text-gray-500 mb-4 uppercase tracking-widest">Gestion des comptes</h3>
            <div id="user-list" class="flex-1 overflow-y-auto space-y-4">
                <p class="text-center text-gray-400 italic text-sm mt-10">Chargement...</p>
            </div>
        </div>
        <!-- ACTION GLOBALE -->
<div class="mb-6">
    <button onclick="window.location.href='upload_admin.html'" class="w-full btn-game bg-indigo-500 text-white p-4 rounded-3xl font-black italic flex items-center justify-center gap-3 shadow-lg">
        <span>📤</span> UPLOADER DANS LA LISTE COMMUNE
    </button>
</div>

    </main>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        if (localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        // VERIFICATION SECURITE ADMIN
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            const snap = await get(ref(db, `users/${user.uid}`));
            if (!snap.exists() || snap.val().isAdmin !== true) {
                alert("Accès refusé !");
                window.location.href = 'menu.html';
                return;
            }
            loadUsers();
        });

        function loadUsers() {
            onValue(ref(db, 'users'), (snapshot) => {
                const list = document.getElementById('user-list');
                const totalText = document.getElementById('stat-total');
                const adminsText = document.getElementById('stat-admins');
                list.innerHTML = "";
                
                if (snapshot.exists()) {
                    const users = snapshot.val();
                    const entries = Object.entries(users);
                    totalText.innerText = entries.length;
                    let adminCount = 0;

                    entries.forEach(([id, data]) => {
                        if(data.isAdmin) adminCount++;

                        const card = document.createElement('div');
                        card.className = "p-4 bg-white/60 dark:bg-zinc-900/50 rounded-2xl border-b-4 border-black/5 flex flex-col gap-3";
                        
                        card.innerHTML = `
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="font-black text-sm dark:text-white uppercase">${data.pseudo || 'Anonyme'}</p>
                                    <p class="text-[9px] text-gray-400 font-bold break-all">${id}</p>
                                </div>
                                <span class="${data.isAdmin ? 'text-amber-500' : 'text-gray-300'} text-lg">★</span>
                            </div>
                            
                            <div class="grid grid-cols-3 gap-2">
                                <button onclick="toggleAdmin('${id}', ${data.isAdmin || false})" 
                                    class="btn-action ${data.isAdmin ? 'bg-amber-100 text-amber-600' : 'bg-gray-100 text-gray-500'}">
                                    Admin
                                </button>
                                <button onclick="window.location.href='Admin_Gallery.html?uid=${id}&name=${encodeURIComponent(data.pseudo)}'" 
                                    class="btn-action bg-blue-100 text-blue-600">
                                    Galerie
                                </button>
                                <button onclick="deleteUser('${id}')" 
                                    class="btn-action bg-rose-100 text-rose-600">
                                    Suppr.
                                </button>
                            </div>
                        `;
                        list.appendChild(card);
                    });
                    adminsText.innerText = adminCount;
                }
            });
        }

        // CHANGER ROLE ADMIN
        window.toggleAdmin = async (userId, currentStatus) => {
            if(confirm(currentStatus ? "Retirer les droits Admin ?" : "Nommer Admin ?")) {
                await update(ref(db, `users/${userId}`), { isAdmin: !currentStatus });
            }
        };

        // SUPPRIMER UTILISATEUR + SES SONS
        window.deleteUser = async (userId) => {
            if(confirm("⚠️ Supprimer définitivement cet utilisateur et TOUS ses sons ?")) {
                const updates = {};
                updates[`users/${userId}`] = null;
                updates[`musics/users/${userId}`] = null;
                await update(ref(db), updates);
                alert("Utilisateur et galerie supprimés.");
            }
        };
    </script>
</body>
</html>
