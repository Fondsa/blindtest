<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upload Base64 - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; height: 100dvh; overflow: hidden; 
            display: flex; flex-direction: column; background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1; overflow: hidden; }
        .cloud { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6; animation: floatClouds 15s infinite alternate ease-in-out; }
        .cloud-pink { background: #ffdce0; width: 60vw; height: 60vw; top: -10%; left: -5%; }
        .cloud-blue { background: #dcf2ff; width: 70vw; height: 70vw; bottom: -15%; right: -5%; }
        
        @keyframes floatClouds { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }

        .btn-game {
            border-radius: 20px;
            color: white;
            font-weight: 700;
            border-bottom: 5px solid rgba(0,0,0,0.15);
            transition: all 0.1s ease;
            text-transform: uppercase;
        }
        .btn-game:active { transform: translateY(3px); border-bottom-width: 2px; }
        .btn-primary { background-color: #a0c4ff; }
        .btn-disabled { background-color: #d1d5db; border-bottom: none; transform: none; cursor: not-allowed; }

        .bento-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
        }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }

        input::file-selector-button {
            background: #ff9aa2;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="bg-container" class="dark:hidden">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
    </div>

    <main class="relative z-10 flex flex-col h-full w-full p-6 items-center justify-center">
        
        <div class="w-full max-w-md space-y-6">
            <div class="text-center">
                <h1 class="text-4xl font-black text-gray-800 dark:text-white italic tracking-tighter uppercase">Importer</h1>
                <p class="text-gray-500 dark:text-gray-400 font-medium text-sm">Le son sera converti en texte (Base64)</p>
            </div>

            <div class="bento-card p-6 space-y-4">
                <!-- Champ Titre -->
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Titre de la musique</label>
                    <input type="text" id="track-title" placeholder="Ex: Pokémon Theme" 
                        class="w-full p-3 rounded-xl bg-white/50 dark:bg-black/20 dark:text-white border-none focus:ring-2 focus:ring-rose-300 outline-none">
                </div>

                <!-- Champ Artiste -->
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Artiste</label>
                    <input type="text" id="track-artist" placeholder="Ex: Jason Paige" 
                        class="w-full p-3 rounded-xl bg-white/50 dark:bg-black/20 dark:text-white border-none focus:ring-2 focus:ring-rose-300 outline-none">
                </div>

                <!-- Champ Fichier -->
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Fichier Audio (Max 2 Mo)</label>
                    <input type="file" id="track-file" accept="audio/*" 
                        class="w-full text-sm text-gray-500 dark:text-gray-300">
                </div>

                <!-- Status Message -->
                <div id="upload-status" class="hidden text-center text-xs font-bold py-3 rounded-xl transition-all"></div>

                <!-- Bouton Action -->
                <button id="btn-upload" class="btn-game btn-primary w-full py-4 mt-2">Enregistrer en base</button>
            </div>

            <button onclick="window.location.href='menu.html'" class="w-full text-gray-400 font-bold text-sm hover:underline">Retour au menu</button>
        </div>

    </main>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const btnUpload = document.getElementById('btn-upload');
        const status = document.getElementById('upload-status');
        let currentUserId = "invite";

        // Vérifier la connexion
        onAuthStateChanged(auth, (user) => {
            if (user) currentUserId = user.uid;
        });

        // Fonction de conversion magique
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        btnUpload.onclick = async () => {
            const file = document.getElementById('track-file').files[0];
            const title = document.getElementById('track-title').value.trim();
            const artist = document.getElementById('track-artist').value.trim();

            // Validations
            if (!file || !title) {
                showStatus("Titre et fichier requis !", "bg-red-100 text-red-600");
                return;
            }

            if (file.size > 2.5 * 1024 * 1024) { // 2.5 Mo max conseillé
                showStatus("Fichier trop lourd (Max 2.5 Mo)", "bg-red-100 text-red-600");
                return;
            }

            try {
                // UI State: Loading
                btnUpload.disabled = true;
                btnUpload.classList.add('btn-disabled');
                btnUpload.innerText = "Traitement...";
                showStatus("Conversion du son en cours...", "bg-blue-100 text-blue-600 animate-pulse");

                // 1. Conversion Base64
                const base64Data = await toBase64(file);

                // 2. Envoi Firebase
                showStatus("Envoi vers la base de données...", "bg-yellow-100 text-yellow-700");
                const userMusicRef = ref(db, `musics/users/${currentUserId}`);
                
                await push(userMusicRef, {
                    title: title,
                    artist: artist || "Inconnu",
                    url: base64Data, // C'est ici que le fichier est stocké en texte
                    createdAt: Date.now()
                });

                showStatus("Terminé ! Musique ajoutée.", "bg-green-100 text-green-700");
                
                // Reset Form
                document.getElementById('track-title').value = "";
                document.getElementById('track-artist').value = "";
                document.getElementById('track-file').value = "";

            } catch (error) {
                console.error(error);
                showStatus("Erreur : " + error.message, "bg-red-100 text-red-600");
            } finally {
                btnUpload.disabled = false;
                btnUpload.classList.remove('btn-disabled');
                btnUpload.innerText = "Enregistrer en base";
            }
        };

        function showStatus(msg, classes) {
            status.innerText = msg;
            status.className = `text-center text-xs font-bold py-3 rounded-xl ${classes}`;
            status.classList.remove('hidden');
        }

        if(localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');
    </script>
</body>
</html>
