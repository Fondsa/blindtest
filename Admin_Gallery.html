<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galerie Admin - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; height: 100dvh; overflow: hidden; 
            display: flex; flex-direction: column; background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        .dark #bg-container { display: none; }

        #bg-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1;
            overflow: hidden;
        }
        .cloud {
            position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6;
            animation: floatClouds 15s infinite alternate ease-in-out;
        }
        .cloud-pink { background: #ffdce0; width: 60vw; height: 60vw; top: -10%; left: -5%; }
        .cloud-blue { background: #dcf2ff; width: 70vw; height: 70vw; bottom: -15%; right: -5%; }
        
        @keyframes floatClouds { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }

        .bento-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
        }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }

        .btn-back { border-radius: 15px; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; }

        .music-item {
            transition: all 0.2s;
            border-left: 4px solid #a0c4ff;
        }
        .music-item:hover { transform: translateX(5px); background: rgba(255,255,255,0.8); }

        #gallery-list::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="bg-container">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
    </div>

    <main class="relative z-10 flex flex-col h-full w-full p-6">
        
        <div class="flex items-center gap-4 mb-6">
            <button onclick="history.back()" class="bento-card btn-back text-lg">⬅️</button>
            <div>
                <h1 class="text-xs font-bold text-gray-400 uppercase tracking-widest leading-none">Galerie de</h1>
                <p id="target-name" class="text-xl font-black dark:text-white italic uppercase tracking-tighter">Chargement...</p>
            </div>
        </div>

        <div class="bento-card p-4 mb-4 flex justify-between items-center">
            <span class="text-xs font-bold text-gray-500 uppercase">Titres importés</span>
            <span id="music-count" class="bg-rose-400 text-white px-3 py-1 rounded-full text-xs font-black">0</span>
        </div>

        <div class="flex-1 bento-card p-4 overflow-hidden flex flex-col">
            <div id="gallery-list" class="flex-1 overflow-y-auto space-y-3">
                <div class="flex flex-col items-center justify-center h-full text-gray-400 animate-pulse">
                    <span class="text-4xl mb-2">💿</span>
                    <p class="text-xs font-bold uppercase">Recherche des morceaux...</p>
                </div>
            </div>
        </div>

        <p class="text-center text-[9px] text-gray-400 font-bold mt-4 uppercase tracking-[0.2em]">Gestion de contenu sécurisée</p>

    </main>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        if (localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        const params = new URLSearchParams(window.location.search);
        const targetUid = params.get('uid');
        const targetPseudo = params.get('name');
        
        document.getElementById('target-name').innerText = targetPseudo || "Utilisateur";

        // SECURITE ADMIN
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            const snap = await get(ref(db, `users/${user.uid}`));
            if (!snap.exists() || snap.val().isAdmin !== true) {
                window.location.href = 'menu.html';
                return;
            }
            if (targetUid) loadUserGallery();
        });

        function loadUserGallery() {
            onValue(ref(db, `musics/users/${targetUid}`), (snapshot) => {
                const list = document.getElementById('gallery-list');
                const countBadge = document.getElementById('music-count');
                list.innerHTML = "";
                
                if (snapshot.exists()) {
                    const musics = snapshot.val();
                    const entries = Object.entries(musics);
                    countBadge.innerText = entries.length;

                    entries.forEach(([id, music]) => {
                        const div = document.createElement('div');
                        div.className = "music-item flex justify-between items-center p-4 bg-white/40 dark:bg-white/5 rounded-2xl";
                        
                        div.innerHTML = `
                            <div class="flex-1 min-w-0 pr-4">
                                <p class="text-sm font-black dark:text-white uppercase truncate">${music.title}</p>
                                <p class="text-[10px] text-gray-400 font-bold uppercase truncate">${music.artist || 'Artiste Inconnu'}</p>
                            </div>
                            <button onclick="confirmDelete('${id}')" class="w-10 h-10 flex items-center justify-center bg-rose-100 dark:bg-rose-900/30 text-rose-500 rounded-xl transition-transform active:scale-90">
                                🗑️
                            </button>
                        `;
                        list.appendChild(div);
                    });
                } else {
                    countBadge.innerText = "0";
                    list.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-gray-400 opacity-50">
                            <span class="text-4xl mb-2">🤷‍♂️</span>
                            <p class="text-xs font-bold uppercase tracking-widest">Galerie vide</p>
                        </div>
                    `;
                }
            });
        }

        window.confirmDelete = (musicId) => {
            if(confirm("Supprimer ce morceau de la bibliothèque de l'utilisateur ?")) {
                remove(ref(db, `musics/users/${targetUid}/${musicId}`));
            }
        };

    </script>
</body>
</html>
