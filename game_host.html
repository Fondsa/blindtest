<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Régie Game - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { font-family: 'Fredoka', sans-serif; margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; background-color: #ffffff; transition: background-color 0.3s ease; }
        .dark body { background-color: #000000; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1; overflow: hidden; }
        .cloud { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6; animation: floatClouds 15s infinite alternate ease-in-out; }
        .cloud-pink { background: #ffdce0; width: 60vw; height: 60vw; top: -10%; left: -5%; }
        .cloud-blue { background: #dcf2ff; width: 70vw; height: 70vw; bottom: -15%; right: -5%; }
        @keyframes floatClouds { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }
        
        .btn-game { border-radius: 20px; color: white; font-weight: 700; border-bottom: 5px solid rgba(0,0,0,0.15); transition: 0.1s; text-transform: uppercase; font-size: 0.75rem; }
        .btn-game:active { transform: translateY(3px); border-bottom-width: 2px; }
        .btn-play { background-color: #b9fbc0; color: #1a531b; }
        .btn-pause { background-color: #fef08a; color: #854d0e; }
        .btn-stop { background-color: #ff9aa2; }
        .btn-reveal { background-color: #a0c4ff; color: white !important; }

        .bento-card { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 24px; }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
        
        .skeleton { background: linear-gradient(90deg, rgba(0,0,0,0.05) 25%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.05) 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 12px; height: 40px; margin-bottom: 8px; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .loading-overlay-active { pointer-events: none; filter: grayscale(0.5); opacity: 0.7; cursor: wait; }
    </style>
</head>
<body>

    <div id="bg-container" class="dark:hidden">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
    </div>

    <div id="modal-history" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm items-center justify-center p-6">
        <div class="bento-card bg-white/95 dark:bg-zinc-900/95 w-full max-w-sm p-6 shadow-2xl border-4 border-rose-300 text-center">
            <h3 class="text-xl font-black text-gray-800 dark:text-white mb-4 uppercase italic">🏆 Ordre des Buzz</h3>
            <div id="buzz-list-content" class="space-y-2 max-h-60 overflow-y-auto pr-2"></div>
            <button id="close-modal" class="mt-6 w-full py-3 bg-rose-400 text-white font-black rounded-2xl border-b-4 border-rose-600 active:translate-y-1 uppercase">Fermer</button>
        </div>
    </div>

    <main class="relative z-10 flex flex-col h-full w-full p-4 space-y-3">
        <div class="flex justify-between items-center">
            <div class="bento-card px-4 py-2 text-xs font-bold dark:text-white flex gap-2 uppercase tracking-widest">
                Room: <span id="room-id" class="text-rose-400">---</span>
            </div>
            <button onclick="window.location.href='menu.html'" class="text-xs font-bold text-gray-400 underline">Quitter</button>
        </div>

        <div id="main-display" class="bento-card p-6 text-center flex flex-col items-center justify-center min-h-[220px]">
            <h2 id="display-title" class="text-xl font-black text-gray-800 dark:text-white uppercase italic px-2">Préparation...</h2>
            
            <div id="reveal-zone" class="hidden mt-2 p-2">
                <p class="text-gray-400 text-xs font-bold uppercase italic">Réponse envoyée aux joueurs</p>
            </div>

            <div id="buzzer-area" class="mt-6 flex items-center justify-center gap-3">
                <div id="buzz-status-pill" class="bg-gray-100 dark:bg-zinc-800 px-6 py-2 rounded-full border-2 border-gray-200 dark:border-zinc-700 transition-all">
                    <span id="fastest-player-label" class="text-gray-400 dark:text-gray-500 font-black text-sm uppercase italic">En attente...</span>
                </div>
                <button id="open-history" class="w-12 h-12 bg-white dark:bg-zinc-800 rounded-full flex items-center justify-center shadow-md border-2 border-rose-200 text-xl">📜</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col min-h-0 space-y-3">
            <div class="bento-card p-3 flex flex-col min-h-[45%]">
                <h3 class="text-[10px] font-black mb-2 text-gray-400 uppercase tracking-widest">📦 Musiques de Base</h3>
                <div id="list-base" class="flex-1 overflow-y-auto space-y-2">
                    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                </div>
            </div>
            <div class="bento-card p-3 flex flex-col min-h-[45%]">
                <h3 class="text-[10px] font-black mb-2 text-gray-400 uppercase tracking-widest">📂 Mes Imports</h3>
                <div id="list-imported" class="flex-1 overflow-y-auto space-y-2">
                    <div class="skeleton"></div><div class="skeleton"></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2 h-16">
            <button id="ctrl-play" class="btn-game btn-play">Play</button>
            <button id="ctrl-pause" class="btn-game btn-pause">Pause</button>
            <button id="ctrl-stop" class="btn-game btn-stop">Stop</button>
            <button id="ctrl-reveal" class="btn-game btn-reveal">Révéler</button>
        </div>
    </main>

    <div class="bento-card p-3 mb-3">
    <h3 class="text-[10px] font-black mb-2 text-rose-400 uppercase tracking-widest">⚡ Ajout Rapide (URL)</h3>
    <div class="flex gap-2">
        <input id="quick-url" type="text" placeholder="Lien YouTube ou URL .mp3" class="flex-1 bg-white/20 border-none rounded-lg p-2 text-xs text-white">
        <button id="btn-quick-add" class="bg-rose-500 text-white px-3 rounded-lg text-xs font-bold">+</button>
    </div>
</div>

    <audio id="audio-player"></audio>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        if(localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const audio = document.getElementById('audio-player');
        const displayTitle = document.getElementById('display-title');
        
        document.getElementById('room-id').innerText = roomId;
        let playersCache = {};

        onAuthStateChanged(auth, (user) => {
            if (!user) return;
            displayTitle.innerText = "Sélectionnez un son";
            
            onValue(ref(db, `rooms/${roomId}/players`), snap => {
                playersCache = snap.val() || {};
            });

            onValue(ref(db, 'musics/base'), snap => renderList(snap, 'list-base', 'musics/base'));
            onValue(ref(db, `musics/users/${user.uid}`), snap => renderList(snap, 'list-imported', `musics/users/${user.uid}`));

            const buzzRef = ref(db, `rooms/${roomId}/buzzHistory`);
            onValue(buzzRef, (snapshot) => {
                if (snapshot.exists()) {
                    handleBuzzEvent(snapshot.val());
                } else {
                    resetBuzzDisplay();
                }
            });
        });

        function renderList(snapshot, elementId, dbPath) {
            const container = document.getElementById(elementId);
            container.innerHTML = "";
            if (snapshot.exists()) {
                Object.entries(snapshot.val()).forEach(([id, track]) => {
                    const item = document.createElement('div');
                    item.className = "p-3 bg-white/40 dark:bg-white/5 rounded-xl cursor-pointer hover:bg-rose-50 dark:hover:bg-rose-900/20 transition-all text-sm font-bold dark:text-white border-2 border-transparent hover:border-rose-200";
                    const fullName = track.artist ? `${track.title} - ${track.artist}` : track.title;
                    item.innerText = fullName;
                    item.onclick = () => loadTrack(dbPath, id, fullName);
                    container.appendChild(item);
                });
            } else {
                container.innerHTML = "<p class='text-xs text-gray-400 italic'>Aucun son trouvé</p>";
            }
        }

        document.getElementById('btn-quick-add').onclick = async () => {
    const url = document.getElementById('quick-url').value;
    if (!url) return;

    let title = "Nouveau son";
    let artist = "Inconnu";

    // Tentative d'extraction intelligente du nom si c'est un lien YouTube
    // Note : Pour un vrai blindtest, on utilise souvent des titres de vidéos
    if (url.includes("youtube.com") || url.includes("youtu.be")) {
        title = "Lien Vidéo";
        artist = "YouTube";
        // Optionnel : Tu peux utiliser un service comme oEmbed pour avoir le vrai titre
    } else {
        // Extraction du nom de fichier si c'est un lien direct
        const fileName = url.split('/').pop().split('?')[0];
        title = decodeURIComponent(fileName).replace('.mp3', '');
    }

    const newMusicRef = ref(db, `musics/users/${auth.currentUser.uid}`);
    // On l'ajoute à tes imports
    const newSong = push(newMusicRef);
    await set(newSong, {
        title: title,
        artist: artist,
        url: url,
        createdAt: serverTimestamp()
    });
    
    document.getElementById('quick-url').value = "";
    alert("Musique ajoutée à 'Mes Imports' !");
};

        // Dans ton onValue(ref(db, `rooms/${roomId}/players`)...
// Tu peux comparer la valeur lastSeen avec Date.now()
// Si la différence est > 10000 (10 sec), le joueur est considéré comme "Laggy" ou Déconnecté
const isOnline = (Date.now() - player.lastSeen) < 10000;
const statusColor = isOnline ? 'bg-green-500' : 'bg-red-500';
// Applique cette couleur au petit rond à côté du nom du joueur

        async function loadTrack(dbPath, id, fullName) {
            displayTitle.innerText = "Chargement...";
            document.getElementById('main-display').classList.add('loading-overlay-active');
            
            const trackSnap = await get(ref(db, `${dbPath}/${id}/url`));
            if (trackSnap.exists()) {
                audio.src = trackSnap.val();
                audio.oncanplaythrough = async () => {
                    displayTitle.innerText = `PRÊT : ${fullName}`;
                    document.getElementById('main-display').classList.remove('loading-overlay-active');
                    document.getElementById('reveal-zone').classList.add('hidden');
                    
                    await update(ref(db, `rooms/${roomId}`), { 
                        state: 'ready',
                        currentTrack: fullName,
                        currentAudio: trackSnap.val(),
                        buzzHistory: null,
                        revealed: false 
                    });
                };
            }
        }

        function handleBuzzEvent(buzzes) {
            // Le premier buzz coupe le son pour tout le monde
            audio.pause(); 
            
            const sorted = Object.entries(buzzes).sort((a,b) => a[1] - b[1]);
            const [winnerId] = sorted[0];
            const pseudo = playersCache[winnerId] ? playersCache[winnerId].pseudo : "Inconnu";

            document.getElementById('fastest-player-label').innerText = `🚨 ${pseudo} A BUZZÉ !`;
            document.getElementById('buzz-status-pill').className = "bg-rose-100 dark:bg-rose-900/60 px-6 py-2 rounded-full border-2 border-rose-400 animate-bounce shadow-lg";

            const historyList = document.getElementById('buzz-list-content');
            historyList.innerHTML = sorted.map(([uid, time], i) => {
                const p = playersCache[uid] ? playersCache[uid].pseudo : "Inconnu";
                const delay = i === 0 ? "1er" : `+${((time - sorted[0][1])/1000).toFixed(2)}s`;
                return `<div class="p-2 bg-white/10 rounded-lg flex justify-between text-sm"><b>${p}</b> <i>${delay}</i></div>`;
            }).join('');
        }

        function resetBuzzDisplay() {
            document.getElementById('fastest-player-label').innerText = "En attente...";
            document.getElementById('buzz-status-pill').className = "bg-gray-100 dark:bg-zinc-800 px-6 py-2 rounded-full border-2 border-gray-200 dark:border-zinc-700";
        }

        document.getElementById('ctrl-play').onclick = () => {
            if (audio.src) {
                audio.play();
                update(ref(db, `rooms/${roomId}`), { state: 'playing', startTime: Date.now() });
            }
        };

        document.getElementById('ctrl-pause').onclick = () => audio.pause();

        document.getElementById('ctrl-stop').onclick = async () => {
            audio.pause(); audio.currentTime = 0;
            await update(ref(db, `rooms/${roomId}`), { 
                state: 'stopped', 
                revealed: false,
                buzzHistory: null 
            });
        };

        // LE BOUTON RÉVÉLER : Envoie le signal aux joueurs et verrouille
        document.getElementById('ctrl-reveal').onclick = async () => {
            const roomRef = ref(db, `rooms/${roomId}`);
            const snap = await get(roomRef);
            const isCurrentlyRevealed = snap.val()?.revealed || false;

            await update(roomRef, { 
                revealed: !isCurrentlyRevealed,
                state: isCurrentlyRevealed ? 'playing' : 'revealed' // Bloque le buzzer si on révèle
            });

            // Feedback visuel sur la régie
            if (!isCurrentlyRevealed) {
                document.getElementById('reveal-zone').classList.remove('hidden');
                displayTitle.innerText = "RÉPONSE RÉVÉLÉE";
            } else {
                document.getElementById('reveal-zone').classList.add('hidden');
                displayTitle.innerText = "RETOUR AU JEU";
            }
        };

        document.getElementById('open-history').onclick = () => document.getElementById('modal-history').classList.remove('hidden');
        document.getElementById('close-modal').onclick = () => document.getElementById('modal-history').classList.add('hidden');
    </script>
</body>
</html>
