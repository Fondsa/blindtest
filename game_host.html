<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Régie Game - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; height: 100dvh; overflow: hidden; 
            display: flex; flex-direction: column; background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1; overflow: hidden; }
        .cloud { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6; animation: floatClouds 15s infinite alternate ease-in-out; }
        .cloud-pink { background: #ffdce0; width: 60vw; height: 60vw; top: -10%; left: -5%; }
        .cloud-blue { background: #dcf2ff; width: 70vw; height: 70vw; bottom: -15%; right: -5%; }
        
        @keyframes floatClouds { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }

        .btn-game { border-radius: 20px; color: white; font-weight: 700; border-bottom: 5px solid rgba(0,0,0,0.15); transition: 0.1s; text-transform: uppercase; font-size: 0.75rem; }
        .btn-game:active { transform: translateY(3px); border-bottom-width: 2px; }
        
        .btn-play { background-color: #b9fbc0; color: #1a531b; }
        .btn-pause { background-color: #fef08a; color: #854d0e; }
        .btn-stop { background-color: #ff9aa2; }
        .btn-reveal { background-color: #a0c4ff; }

        .bento-card { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 24px; }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        .loading-pulse { animation: pulse 1.5s infinite; opacity: 0.5; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 0.7; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="bg-container" class="dark:hidden">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
    </div>

    <main class="relative z-10 flex flex-col h-full w-full p-4 space-y-3">
        
        <!-- HEADER -->
        <div class="flex justify-between items-center">
            <div class="bento-card px-4 py-2 text-xs font-bold dark:text-white uppercase tracking-tighter">Room: <span id="room-id" class="text-rose-400">---</span></div>
            <button onclick="window.location.href='menu.html'" class="text-xs font-bold text-gray-400 underline">Quitter</button>
        </div>

        <!-- ECRAN DE RÉVÉLATION -->
        <div class="bento-card p-4 text-center flex flex-col items-center justify-center min-h-[120px]">
            <h2 id="display-title" class="text-xl font-black text-gray-800 dark:text-white uppercase italic">Prêt à jouer ?</h2>
            <div id="reveal-zone" class="hidden mt-2 p-2 bg-white/50 dark:bg-white/10 rounded-xl">
                <p id="artist-name" class="text-rose-500 font-bold text-md uppercase"></p>
            </div>
            <!-- Indicateur de qui a buzzé -->
            <div id="buzzer-alert" class="hidden mt-2 font-bold text-rose-600 animate-bounce">🚨 BUZZ !</div>
        </div>

        <!-- DOUBLE PLAYLIST -->
        <div class="flex-1 flex flex-col min-h-0 space-y-3">
            <div class="bento-card p-3 flex flex-col min-h-[45%]">
                <h3 class="text-[10px] font-black mb-2 text-gray-400 uppercase tracking-widest">📦 Musiques de Base (Admin)</h3>
                <div id="list-base" class="flex-1 overflow-y-auto space-y-2 custom-scroll"></div>
            </div>

            <div class="bento-card p-3 flex flex-col min-h-[45%]">
                <h3 class="text-[10px] font-black mb-2 text-gray-400 uppercase tracking-widest">📂 Mes Imports (Compte)</h3>
                <div id="list-imported" class="flex-1 overflow-y-auto space-y-2 custom-scroll"></div>
            </div>
        </div>

        <!-- RÉGIE AUDIO -->
        <div class="grid grid-cols-4 gap-2 h-16">
            <button id="ctrl-play" class="btn-game btn-play">Play</button>
            <button id="ctrl-pause" class="btn-game btn-pause">Pause</button>
            <button id="ctrl-stop" class="btn-game btn-stop">Stop</button>
            <button id="ctrl-reveal" class="btn-game btn-reveal">Révéler</button>
        </div>

    </main>

    <audio id="audio-player"></audio>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        if(localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const audio = document.getElementById('audio-player');
        const displayTitle = document.getElementById('display-title');
        const buzzerAlert = document.getElementById('buzzer-alert');
        
        document.getElementById('room-id').innerText = roomId;

        onAuthStateChanged(auth, (user) => {
            if (!user) return;

            onValue(ref(db, 'musics/base'), (snapshot) => {
                renderList(snapshot, 'list-base', 'musics/base');
            });

            onValue(ref(db, `musics/users/${user.uid}`), (snapshot) => {
                renderList(snapshot, 'list-imported', `musics/users/${user.uid}`);
            });
        });

        function renderList(snapshot, elementId, dbPath) {
            const container = document.getElementById(elementId);
            container.innerHTML = "";
            if (snapshot.exists()) {
                Object.entries(snapshot.val()).forEach(([id, track]) => {
                    const item = document.createElement('div');
                    item.className = "p-2 bg-white/40 dark:bg-white/5 rounded-xl cursor-pointer hover:bg-white/80 transition-all text-sm font-bold dark:text-white border-l-4 border-transparent hover:border-rose-300";
                    item.innerText = track.title;
                    
                    item.onclick = async () => {
                        try {
                            displayTitle.innerText = "Chargement...";
                            displayTitle.classList.add('loading-pulse');
                            
                            // Récupération ponctuelle du son
                            const trackSnap = await get(ref(db, `${dbPath}/${id}/url`));
                            
                            if (trackSnap.exists()) {
                                const audioUrl = trackSnap.val();
                                audio.src = audioUrl;
                                
                                // Reset de l'interface
                                displayTitle.innerText = "Morceau chargé !";
                                displayTitle.classList.remove('loading-pulse');
                                document.getElementById('artist-name').innerText = track.title + (track.artist ? " - " + track.artist : "");
                                document.getElementById('reveal-zone').classList.add('hidden');
                                buzzerAlert.classList.add('hidden');

                                // Synchronisation avec les joueurs
                                update(ref(db, `rooms/${roomId}`), { 
                                    state: 'playing', 
                                    currentTrack: track.title,
                                    currentAudio: audioUrl,
                                    startTime: Date.now(),
                                    buzzedBy: null // Très important : on libère le buzzer
                                });
                                
                                audio.play(); 
                            }
                        } catch (e) {
                            displayTitle.innerText = "Erreur !";
                            console.error(e);
                        }
                    };
                    container.appendChild(item);
                });
            } else {
                container.innerHTML = `<p class="text-[10px] text-gray-400 italic text-center mt-2">Aucun titre trouvé</p>`;
            }
        }

        // Surveiller si quelqu'un buzze pour stopper le son localement aussi
        onValue(ref(db, `rooms/${roomId}/buzzedBy`), (snapshot) => {
            if (snapshot.exists()) {
                audio.pause();
                buzzerAlert.classList.remove('hidden');
                // On pourrait ici chercher le pseudo du joueur via l'ID pour l'afficher
                displayTitle.innerText = "BUZZ DÉTECTÉ !";
            }
        });

        // COMMANDES RÉGIE
        document.getElementById('ctrl-play').onclick = () => audio.play();
        document.getElementById('ctrl-pause').onclick = () => audio.pause();
        document.getElementById('ctrl-stop').onclick = () => { audio.pause(); audio.currentTime = 0; };
        document.getElementById('ctrl-reveal').onclick = () => document.getElementById('reveal-zone').classList.toggle('hidden');

    </script>
</body>
</html>
