<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Régie Game - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; height: 100dvh; overflow: hidden; 
            display: flex; flex-direction: column; background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1; overflow: hidden; }
        .cloud { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6; animation: floatClouds 15s infinite alternate ease-in-out; }
        .cloud-pink { background: #ffdce0; width: 60vw; height: 60vw; top: -10%; left: -5%; }
        .cloud-blue { background: #dcf2ff; width: 70vw; height: 70vw; bottom: -15%; right: -5%; }
        
        @keyframes floatClouds { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }

        .btn-game { border-radius: 20px; color: white; font-weight: 700; border-bottom: 5px solid rgba(0,0,0,0.15); transition: 0.1s; text-transform: uppercase; font-size: 0.75rem; }
        .btn-game:active { transform: translateY(3px); border-bottom-width: 2px; }
        
        .btn-play { background-color: #b9fbc0; color: #1a531b; }
        .btn-pause { background-color: #fef08a; color: #854d0e; }
        .btn-stop { background-color: #ff9aa2; }
        .btn-reveal { background-color: #a0c4ff; color: #1e3a8a; }

        .bento-card { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 24px; }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="bg-container" class="dark:hidden">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
    </div>

    <div id="modal-history" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm items-center justify-center p-6">
        <div class="bento-card bg-white/95 dark:bg-zinc-900/95 w-full max-w-sm p-6 shadow-2xl border-4 border-rose-300">
            <h3 class="text-xl font-black text-gray-800 dark:text-white mb-4 uppercase italic text-center">🏆 Ordre des Buzz</h3>
            <div id="buzz-list-content" class="space-y-2 max-h-60 overflow-y-auto custom-scroll pr-2">
                <p class="text-center text-gray-400 italic text-xs">Aucun buzz pour le moment</p>
            </div>
            <button id="close-modal" class="mt-6 w-full py-3 bg-rose-400 text-white font-black rounded-2xl border-b-4 border-rose-600 active:translate-y-1 active:border-b-0 transition-all uppercase">Fermer</button>
        </div>
    </div>

    <main class="relative z-10 flex flex-col h-full w-full p-4 space-y-3">
        
        <div class="flex justify-between items-center">
            <div class="bento-card px-4 py-2 text-xs font-bold dark:text-white uppercase tracking-tighter flex gap-2">
                Room: <span id="room-id" class="text-rose-400">---</span>
            </div>
            <button onclick="window.location.href='menu.html'" class="text-xs font-bold text-gray-400 underline">Quitter</button>
        </div>

        <div class="bento-card p-6 text-center flex flex-col items-center justify-center min-h-[220px]">
            <h2 id="display-title" class="text-xl font-black text-gray-800 dark:text-white uppercase italic px-2">Prêt à jouer ?</h2>
            
            <div id="reveal-zone" class="hidden mt-2 p-2 bg-white/50 dark:bg-white/10 rounded-xl">
                <p id="artist-name" class="text-rose-500 font-bold text-md uppercase italic"></p>
            </div>

            <div id="buzzer-area" class="mt-6 flex items-center justify-center gap-3">
                <div id="buzz-status-pill" class="bg-gray-100 dark:bg-zinc-800 px-6 py-2 rounded-full border-2 border-gray-200 dark:border-zinc-700 shadow-sm transition-all duration-300">
                    <span id="fastest-player-label" class="text-gray-400 dark:text-gray-500 font-black text-sm uppercase italic">En attente d'un buzz...</span>
                </div>
                <button id="open-history" class="w-12 h-12 bg-white dark:bg-zinc-800 rounded-full flex items-center justify-center shadow-md border-2 border-rose-200 hover:scale-110 transition-transform text-xl">📜</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col min-h-0 space-y-3">
            <div class="bento-card p-3 flex flex-col min-h-[45%]">
                <h3 class="text-[10px] font-black mb-2 text-gray-400 uppercase tracking-widest">📦 Musiques de Base</h3>
                <div id="list-base" class="flex-1 overflow-y-auto space-y-2 custom-scroll"></div>
            </div>

            <div class="bento-card p-3 flex flex-col min-h-[45%]">
                <h3 class="text-[10px] font-black mb-2 text-gray-400 uppercase tracking-widest">📂 Mes Imports</h3>
                <div id="list-imported" class="flex-1 overflow-y-auto space-y-2 custom-scroll"></div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2 h-16">
            <button id="ctrl-play" class="btn-game btn-play shadow-sm">Play</button>
            <button id="ctrl-pause" class="btn-game btn-pause shadow-sm">Pause</button>
            <button id="ctrl-stop" class="btn-game btn-stop shadow-sm">Stop</button>
            <button id="ctrl-reveal" class="btn-game btn-reveal shadow-sm">Révéler</button>
        </div>

    </main>

    <audio id="audio-player"></audio>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { ref, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        if(localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const audio = document.getElementById('audio-player');
        const displayTitle = document.getElementById('display-title');
        const buzzStatusPill = document.getElementById('buzz-status-pill');
        const fastestPlayerLabel = document.getElementById('fastest-player-label');
        const buzzListContent = document.getElementById('buzz-list-content');
        
        document.getElementById('room-id').innerText = roomId;

        onAuthStateChanged(auth, (user) => {
            if (!user) return;
            onValue(ref(db, 'musics/base'), snap => renderList(snap, 'list-base', 'musics/base'));
            onValue(ref(db, `musics/users/${user.uid}`), snap => renderList(snap, 'list-imported', `musics/users/${user.uid}`));
        });

        function renderList(snapshot, elementId, dbPath) {
            const container = document.getElementById(elementId);
            container.innerHTML = "";
            if (snapshot.exists()) {
                Object.entries(snapshot.val()).forEach(([id, track]) => {
                    const item = document.createElement('div');
                    item.className = "p-2 bg-white/40 dark:bg-white/5 rounded-xl cursor-pointer hover:bg-white/80 transition-all text-sm font-bold dark:text-white border-l-4 border-transparent hover:border-rose-300";
                    const fullName = track.artist ? `${track.title} - ${track.artist}` : track.title;
                    item.innerText = fullName;
                    
                    item.onclick = async () => {
                        displayTitle.innerText = "Chargement...";
                        const trackSnap = await get(ref(db, `${dbPath}/${id}/url`));
                        if (trackSnap.exists()) {
                            audio.src = trackSnap.val();
                            displayTitle.innerText = `PRÊT : ${fullName}`;
                            document.getElementById('artist-name').innerText = fullName;
                            document.getElementById('reveal-zone').classList.add('hidden');
                            
                            // Reset complet de la room pour la nouvelle musique
                            await update(ref(db, `rooms/${roomId}`), { 
                                state: 'ready',
                                currentTrack: fullName,
                                currentAudio: trackSnap.val(),
                                buzzedBy: null,
                                buzzHistory: null,
                                revealed: false // Crucial pour cacher la réponse chez le joueur
                            });

                            fastestPlayerLabel.innerText = "En attente d'un buzz...";
                            buzzStatusPill.className = "bg-gray-100 dark:bg-zinc-800 px-6 py-2 rounded-full border-2 border-gray-200 dark:border-zinc-700 shadow-sm";
                        }
                    };
                    container.appendChild(item);
                });
            }
        }

        // --- SURVEILLANCE DES BUZZS ---
        onValue(ref(db, `rooms/${roomId}/buzzHistory`), async (snapshot) => {
            if (snapshot.exists()) {
                audio.pause();
                const history = snapshot.val();
                const sortedEntries = Object.entries(history).sort((a, b) => a[1] - b[1]);
                
                buzzListContent.innerHTML = ""; 
                
                for (let i = 0; i < sortedEntries.length; i++) {
                    const uid = sortedEntries[i][0];
                    const timestamp = sortedEntries[i][1];
                    const playerSnap = await get(ref(db, `rooms/${roomId}/players/${uid}/pseudo`));
                    const pseudo = playerSnap.exists() ? playerSnap.val() : "Anonyme";
                    
                    if (i === 0) {
                        fastestPlayerLabel.innerText = `🚨 ${pseudo} A BUZZÉ !`;
                        buzzStatusPill.className = "bg-rose-100 dark:bg-rose-900/40 px-6 py-2 rounded-full border-2 border-rose-400 animate-bounce shadow-lg";
                        displayTitle.innerText = "BUZZ DÉTECTÉ !";
                    }

                    const delay = i === 0 ? "🏆 GAGNANT" : `+${((timestamp - sortedEntries[0][1]) / 1000).toFixed(2)}s`;
                    const div = document.createElement('div');
                    div.className = `p-3 rounded-xl flex justify-between items-center bg-white/50 dark:bg-white/5 border border-gray-200 dark:border-white/10`;
                    div.innerHTML = `
                        <div class="flex items-center gap-2 text-gray-800 dark:text-white">
                            <span class="font-black text-xs opacity-50">${i + 1}.</span>
                            <span class="font-bold uppercase">${pseudo}</span>
                        </div>
                        <span class="text-[10px] font-black text-rose-500 italic">${delay}</span>
                    `;
                    buzzListContent.appendChild(div);
                }
            } else {
                buzzListContent.innerHTML = `<p class="text-center text-gray-400 italic text-xs">Aucun buzz pour le moment</p>`;
            }
        });

        // COMMANDES RÉGIE
        document.getElementById('ctrl-play').onclick = () => {
            if (audio.src) {
                audio.play();
                update(ref(db, `rooms/${roomId}`), { state: 'playing', startTime: Date.now() });
            }
        };
        
        document.getElementById('ctrl-pause').onclick = () => audio.pause();
        
        document.getElementById('ctrl-stop').onclick = () => { 
            audio.pause(); 
            audio.currentTime = 0; 
            update(ref(db, `rooms/${roomId}`), { buzzedBy: null, buzzHistory: null, revealed: false });
            fastestPlayerLabel.innerText = "En attente d'un buzz...";
            buzzStatusPill.className = "bg-gray-100 dark:bg-zinc-800 px-6 py-2 rounded-full border-2 border-gray-200 dark:border-zinc-700 shadow-sm";
        };

        // RÉVÉLER : Synchronise l'affichage chez le Joueur
        document.getElementById('ctrl-reveal').onclick = async () => {
            const isHidden = document.getElementById('reveal-zone').classList.toggle('hidden');
            await update(ref(db, `rooms/${roomId}`), { revealed: !isHidden });
        };

        // MODAL
        document.getElementById('open-history').onclick = () => document.getElementById('modal-history').classList.remove('hidden');
        document.getElementById('close-modal').onclick = () => document.getElementById('modal-history').classList.add('hidden');

    </script>
</body>
</html>
