<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Host - Blindtest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; padding: 0; 
            height: 100dvh; 
            overflow: hidden; 
            display: flex; flex-direction: column; 
            background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #000000; }
        .dark #bg-container { display: none; }

        /* ☁️ NUAGES PASTEL */
        #bg-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -1;
            overflow: hidden;
        }
        .cloud {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.6;
            animation: floatClouds 15s infinite alternate ease-in-out;
        }
        .cloud-pink { background: #ffdce0; width: 60vw; height: 60vw; top: -10%; left: -5%; }
        .cloud-blue { background: #dcf2ff; width: 70vw; height: 70vw; bottom: -15%; right: -5%; animation-delay: -4s; }
        .cloud-green { background: #dcffe4; width: 45vw; height: 45vw; top: 20%; left: 30%; animation-delay: -7s; }

        @keyframes floatClouds {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.05); }
        }

        /* 🎮 BOUTONS PHYSIQUES */
        .btn-game {
            border-radius: 20px;
            color: white;
            font-weight: 700;
            transition: all 0.1s ease;
            border-bottom: 5px solid rgba(0,0,0,0.2);
            text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .btn-game:active { transform: translateY(3px); border-bottom-width: 2px; }
        
        .btn-success { background-color: #b9fbc0; color: #1a531b; } /* Vert */
        .btn-danger { background-color: #ff9aa2; } /* Rouge */
        .btn-neutral { background-color: #a0c4ff; } /* Bleu */

        /* 🍱 BENTO CARDS */
        .bento-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
        }
        .dark .bento-card { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }

        /* EFFET BUZZER */
        .is-buzzing {
            animation: pulse-buzz 0.5s infinite;
            border: 4px solid #ffde59 !important;
            background: rgba(255, 222, 89, 0.3) !important;
        }
        @keyframes pulse-buzz {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="bg-container">
        <div class="cloud cloud-pink"></div>
        <div class="cloud cloud-blue"></div>
        <div class="cloud cloud-green"></div>
    </div>

    <main class="relative z-10 flex flex-col h-full w-full p-4">
        
        <!-- TOP BAR : INFOS ROOM -->
        <div class="flex justify-between items-center mb-4">
            <div class="bento-card px-4 py-2 text-xs font-bold dark:text-white">
                ROOM: <span id="room-id" class="text-rose-400">-----</span>
            </div>
            <div class="bento-card px-4 py-2 text-xs font-bold dark:text-white">
                MANCHE: <span id="round-num">1/10</span>
            </div>
        </div>

        <!-- ECRAN PRINCIPAL (Réponse / Musique) -->
        <div class="flex-1 flex flex-col items-center justify-center space-y-6">
            <div class="bento-card w-full max-w-2xl p-10 text-center shadow-xl">
                <div id="music-icon" class="text-6xl mb-4">🎵</div>
                <h2 id="display-title" class="text-3xl md:text-5xl font-black text-gray-800 dark:text-white tracking-tighter mb-2 italic">
                    PRÊT ?
                </h2>
                <p id="display-artist" class="text-xl text-rose-400 font-bold uppercase tracking-widest opacity-0 transition-opacity duration-500">
                    Artiste Inconnu
                </p>
            </div>

            <!-- PLAYER AUDIO CACHÉ -->
            <audio id="main-audio" class="hidden"></audio>
        </div>

        <!-- GRILLE DES SCORES / JOUEURS -->
        <div id="player-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <!-- Exemple de carte joueur -->
            <div class="bento-card p-3 flex flex-col items-center justify-center border-b-4 border-black/10">
                <span class="text-xs font-bold text-gray-400">EN ATTENTE</span>
            </div>
        </div>

        <!-- CONTRÔLES HOST -->
        <div class="grid grid-cols-3 gap-3 pb-2">
            <button id="btn-reveal" class="btn-game btn-neutral py-4 italic">Révéler</button>
            <button id="btn-next" class="btn-game btn-success py-4 italic">Suivant</button>
            <button id="btn-stop" class="btn-game btn-danger py-4 italic">Stop</button>
        </div>

    </main>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        document.getElementById('room-id').innerText = roomId || "ERR";

        // 1. ÉCOUTER LES JOUEURS ET LES BUZZ
        const playersRef = ref(db, `rooms/${roomId}/players`);
        onValue(playersRef, (snapshot) => {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = "";
            if (snapshot.exists()) {
                const players = snapshot.val();
                Object.entries(players).forEach(([id, data]) => {
                    const card = document.createElement('div');
                    // Ajout de la classe 'is-buzzing' si le joueur a buzzé
                    const buzzingClass = data.isBuzzing ? 'is-buzzing' : '';
                    
                    card.className = `bento-card p-4 flex flex-col items-center border-b-4 border-black/10 transition-all ${buzzingClass}`;
                    card.innerHTML = `
                        <span class="text-lg font-black dark:text-white">${data.pseudo}</span>
                        <span class="text-2xl font-black text-rose-400">${data.score || 0}</span>
                    `;
                    grid.appendChild(card);
                });
            }
        });

        // 2. BOUTONS DE CONTRÔLE
        document.getElementById('btn-reveal').onclick = () => {
            document.getElementById('display-artist').classList.remove('opacity-0');
        };

        document.getElementById('btn-next').onclick = () => {
            // Logique pour passer au morceau suivant
            document.getElementById('display-artist').classList.add('opacity-0');
            alert("Morceau suivant !");
        };

        // GESTION DU MODE SOMBRE PERSISTANT
        if(localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');
    </script>
</body>
</html>
